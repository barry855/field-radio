
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bravo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1b5e20;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ══════════════════════════════
     LOGIN SCREEN
  ══════════════════════════════ */
  #loginScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 18px;
  }
  .login-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .login-sub {
    font-size: 10px;
    letter-spacing: 3px;
    color: #a5d6a7;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .login-card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 22px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-label {
    font-size: 9px;
    letter-spacing: 2.5px;
    color: #2e7d32;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .login-input {
    width: 100%;
    background: #e8f5e9;
    border: none;
    border-radius: 6px;
    color: #1b5e20;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 14px;
    outline: none;
    letter-spacing: 2px;
  }
  .login-input::placeholder { color: #a5d6a7; font-weight: 400; }

  /* Checkboxes */
  .checkbox-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 2px 0;
  }
  .cb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .cb-item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 2px solid #2e7d32;
    background: #fff;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .cb-item input[type="checkbox"]:checked {
    background: #1b5e20;
    border-color: #1b5e20;
  }
  .cb-item input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 1px;
    width: 6px; height: 10px;
    border: 2px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }
  .cb-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #1b5e20;
    text-transform: uppercase;
    font-weight: 700;
  }
  .cb-note {
    font-size: 9px;
    color: #a5d6a7;
    letter-spacing: 1px;
    margin-top: 1px;
  }

  /* Countdown */
  .login-timer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .login-timer-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #a5d6a7;
    text-transform: uppercase;
  }
  .login-timer-ring {
    position: relative;
    width: 64px;
    height: 64px;
  }
  .login-timer-ring svg {
    transform: rotate(-90deg);
  }
  .login-timer-ring .ring-bg {
    fill: none;
    stroke: #e8f5e9;
    stroke-width: 4;
  }
  .login-timer-ring .ring-fg {
    fill: none;
    stroke: #2e7d32;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 163;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.5s;
  }
  .login-timer-ring .ring-fg.urgent { stroke: #c62828; }
  .login-timer-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #1b5e20;
    letter-spacing: 0;
  }
  .login-timer-num.urgent { color: #c62828; }
  .login-expired-msg {
    font-size: 10px;
    color: #c62828;
    letter-spacing: 1.5px;
    text-align: center;
    display: none;
    text-transform: uppercase;
  }

  .login-btn {
    width: 100%;
    height: 48px;
    border-radius: 7px;
    border: none;
    background: #1b5e20;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .login-btn:hover:not(:disabled) { background: #2e7d32; }
  .login-btn:disabled { background: #a5d6a7; cursor: not-allowed; }

  /* ══════════════════════════════
     MAIN SCREEN
  ══════════════════════════════ */
  #mainScreen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 6px;
  }
  .unit { font-size: 15px; font-weight: 700; letter-spacing: 4px; color: #fff; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #a5d6a7;
    text-transform: uppercase;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #388e3c;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.standby { background: #ffb300; box-shadow: 0 0 8px #ffb300; }
  .dot.linked  { background: #69f0ae; box-shadow: 0 0 8px #69f0ae; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* 10-min session timer */
  .session-timer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #a5d6a7;
    text-transform: uppercase;
    background: rgba(255,255,255,0.08);
    border-radius: 5px;
    padding: 4px 9px;
  }
  .session-timer .st-icon { font-size: 11px; }
  .session-timer .st-time { font-weight: 700; color: #fff; letter-spacing: 2px; font-size: 12px; }
  .session-timer.warn .st-time { color: #ffb300; }
  .session-timer.crit .st-time { color: #ef5350; animation: pulse 1s infinite; }

  /* ── Chat window ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #ffffff;
    margin: 0 16px 12px;
    border-radius: 8px;
    scrollbar-width: thin;
    scrollbar-color: #a5d6a7 #e8f5e9;
  }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .bubble.mine {
    align-self: flex-end;
    background: #1b5e20;
    color: #ffffff;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: #e8f5e9;
    color: #1b5e20;
  }
  .bubble .who {
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .bubble.mine .who  { color: #a5d6a7; }
  .bubble.theirs .who { color: #2e7d32; }

  /* ── Chat input ── */
  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 0 16px 12px;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: #ffffff;
    border: none;
    border-radius: 6px;
    color: #1b5e20;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
  }
  .chat-input::placeholder { color: #a5d6a7; }
  .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .send-btn {
    background: #388e3c;
    border: none;
    border-radius: 6px;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 10px 18px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
  }
  .send-btn:hover { background: #4caf50; }
  .send-btn:disabled { background: #2e7d32; opacity: 0.4; cursor: not-allowed; }

  /* ── PTT ── */
  .ptt-row {
    padding: 0 16px 10px;
    flex-shrink: 0;
  }
  .ptt {
    width: 100%;
    height: 64px;
    border-radius: 8px;
    border: none;
    background: #388e3c;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: not-allowed;
    transition: all 0.08s;
    user-select: none;
    -webkit-user-select: none;
    opacity: 0.4;
  }
  .ptt.ready { opacity: 1; cursor: pointer; }
  .ptt.ready:hover { background: #4caf50; }
  .ptt.transmitting {
    background: #ffb300;
    color: #000;
    box-shadow: 0 0 24px rgba(255,179,0,0.4);
    transform: scale(0.99);
    opacity: 1;
  }

  /* ── Controls row ── */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ctrl-spacer { flex: 1; }

  .toggle-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    padding: 5px 10px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .toggle-pill:hover { background: rgba(255,255,255,0.18); }
  .toggle-pill input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1.5px solid #a5d6a7;
    background: transparent;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .toggle-pill input[type="checkbox"]:checked {
    background: #ffb300;
    border-color: #ffb300;
  }
  .toggle-pill input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 8px;
    border: 1.5px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .toggle-pill-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;
    font-weight: 700;
  }

  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 5px;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 5px 11px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.22); }

  /* ── Log ── */
  .log {
    height: 95px;
    background: #ffffff;
    margin: 0 16px 14px;
    border-radius: 8px;
    padding: 10px 14px;
    overflow-y: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
    scrollbar-color: #a5d6a7 #e8f5e9;
  }
  .log-entry {
    font-size: 10px;
    line-height: 1.9;
    letter-spacing: 0.3px;
  }
  .log-entry.sys  { color: #a5d6a7; }
  .log-entry.info { color: #2e7d32; }
  .log-entry.ok   { color: #1b5e20; }
  .log-entry.err  { color: #c62828; }
  .log-entry.tx   { color: #e65100; }
</style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen">
  <div class="login-title">Bravo</div>
  <div class="login-sub">Secure Radio Link</div>

  <div class="login-card">
    <div>
      <div class="login-label">Unit ID</div>
      <input class="login-input" id="unitIdInput" placeholder="unit-bravo-2w" />
    </div>

    <div class="checkbox-row">
      <label class="cb-item">
        <input type="checkbox" id="loginDisableVideo" />
        <div>
          <div class="cb-label">Disable Video</div>
          <div class="cb-note">Audio-only connection</div>
        </div>
      </label>
      <label class="cb-item">
        <input type="checkbox" id="loginDisableAudio" />
        <div>
          <div class="cb-label">Disable Audio (PTT)</div>
          <div class="cb-note">Text chat only</div>
        </div>
      </label>
    </div>

    <div class="login-timer-wrap">
      <div class="login-timer-label">Session opens in</div>
      <div class="login-timer-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="26"/>
          <circle class="ring-fg" id="loginRingFg" cx="32" cy="32" r="26"/>
        </svg>
        <div class="login-timer-num" id="loginTimerNum">60</div>
      </div>
      <div class="login-expired-msg" id="loginExpiredMsg">Session expired — reload</div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">Connect</button>
  </div>
</div>

<!-- ══ MAIN SCREEN ══ -->
<div id="mainScreen">
  <header>
    <div class="unit">BRAVO</div>
    <div class="header-right">
      <!-- 10-minute session countdown -->
      <div class="session-timer" id="sessionTimer">
        <span class="st-icon">⏱</span>
        <span class="st-label">Session:</span>
        <span class="st-time" id="sessionTimerVal">10:00</span>
      </div>
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusText">Offline</span>
      </div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="Type a message…" disabled />
    <button class="send-btn" id="sendBtn" onclick="sendChat()" disabled>Send</button>
  </div>

  <div class="ptt-row">
    <button class="ptt" id="ptt"
      onmousedown="startTx()"
      onmouseup="stopTx()"
      onmouseleave="stopTx()"
      ontouchstart="startTx(event)"
      ontouchend="stopTx()">Hold to Talk</button>
  </div>

  <!-- Controls row: Disable Video checkbox + Refresh + Flip -->
  <div class="controls-row">
    <label class="toggle-pill" id="disableVideoToggle" title="Disable/Enable Video">
      <input type="checkbox" id="mainDisableVideo" onchange="applyVideoSetting()" />
      <span class="toggle-pill-label">Disable Video</span>
    </label>
    <div class="ctrl-spacer"></div>
    <button class="icon-btn" onclick="doRefresh()" title="Refresh connection">↺ Refresh</button>
    <button class="icon-btn" onclick="doFlip()" title="Flip camera">⇄ Flip</button>
  </div>

  <div class="log" id="log"></div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
/* ────────────────────────────────────────
   CONSTANTS
──────────────────────────────────────── */
const DEFAULT_ID  = 'unit-bravo-2w';
const REMOTE_ID   = 'unit-alpha-2w';
const STORAGE_KEY = 'bravo_last_unit_id';
const LOGIN_SECS  = 60;
const SESSION_SECS = 10 * 60;

/* ────────────────────────────────────────
   LOGIN SCREEN
──────────────────────────────────────── */
const unitIdInput      = document.getElementById('unitIdInput');
const loginBtn         = document.getElementById('loginBtn');
const loginTimerNum    = document.getElementById('loginTimerNum');
const loginRingFg      = document.getElementById('loginRingFg');
const loginExpiredMsg  = document.getElementById('loginExpiredMsg');
const loginDisableVideo = document.getElementById('loginDisableVideo');
const loginDisableAudio = document.getElementById('loginDisableAudio');

// Pre-fill last used Unit ID
const savedId = localStorage.getItem(STORAGE_KEY);
unitIdInput.value = savedId || DEFAULT_ID;

// 60-second login countdown
const ringCircumference = 2 * Math.PI * 26;
loginRingFg.style.strokeDasharray = ringCircumference;

let loginSecsLeft = LOGIN_SECS;
function tickLogin() {
  loginSecsLeft--;
  loginTimerNum.textContent = loginSecsLeft;
  const pct = loginSecsLeft / LOGIN_SECS;
  loginRingFg.style.strokeDashoffset = ringCircumference * (1 - pct);

  if (loginSecsLeft <= 10) {
    loginRingFg.classList.add('urgent');
    loginTimerNum.classList.add('urgent');
  }
  if (loginSecsLeft <= 0) {
    clearInterval(loginTimer);
    loginBtn.disabled = true;
    loginTimerNum.style.display = 'none';
    loginExpiredMsg.style.display = 'block';
    entry('Login timeout — reload page', 'err');
  }
}
const loginTimer = setInterval(tickLogin, 1000);

function doLogin() {
  clearInterval(loginTimer);
  const id = unitIdInput.value.trim() || DEFAULT_ID;
  localStorage.setItem(STORAGE_KEY, id);

  window._disableVideo = loginDisableVideo.checked;
  window._disableAudio = loginDisableAudio.checked;

  document.getElementById('mainDisableVideo').checked = window._disableVideo;

  document.getElementById('loginScreen').style.display = 'none';
  const ms = document.getElementById('mainScreen');
  ms.style.display = 'flex';

  startSessionTimer();
  init(id);
}

/* ────────────────────────────────────────
   10-MINUTE SESSION TIMER
──────────────────────────────────────── */
const sessionTimerEl  = document.getElementById('sessionTimer');
const sessionTimerVal = document.getElementById('sessionTimerVal');

function startSessionTimer() {
  let secsLeft = SESSION_SECS;
  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  sessionTimerVal.textContent = fmt(secsLeft);

  const t = setInterval(() => {
    secsLeft--;
    sessionTimerVal.textContent = fmt(secsLeft);
    sessionTimerEl.classList.remove('warn','crit');
    if (secsLeft <= 60)       sessionTimerEl.classList.add('crit');
    else if (secsLeft <= 120) sessionTimerEl.classList.add('warn');
    if (secsLeft <= 0) {
      clearInterval(t);
      sessionTimerVal.textContent = '00:00';
      entry('Session expired — please reconnect', 'err');
    }
  }, 1000);
}

/* ────────────────────────────────────────
   RADIO LOGIC
──────────────────────────────────────── */
let peer, call, dataConn, localStream, linked = false;

const dot       = document.getElementById('dot');
const statusEl  = document.getElementById('statusText');
const ptt       = document.getElementById('ptt');
const logEl     = document.getElementById('log');
const chat      = document.getElementById('chat');
const chatInput = document.getElementById('chatInput');
const sendBtn   = document.getElementById('sendBtn');

function entry(msg, cls='sys') {
  const ts = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.className = 'log-entry ' + cls;
  d.textContent = `${ts}  ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(state) {
  dot.className = 'dot ' + state;
  const labels = { '': 'Offline', standby: 'Standby', linked: 'Linked' };
  statusEl.textContent = labels[state] ?? state;
}

function addBubble(text, mine) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + (mine ? 'mine' : 'theirs');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = mine ? 'Bravo' : 'Alpha';
  const msg = document.createElement('div');
  msg.textContent = text;
  wrap.appendChild(who);
  wrap.appendChild(msg);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function sendChat() {
  const txt = chatInput.value.trim();
  if (!txt || !dataConn) return;
  dataConn.send(txt);
  addBubble(txt, true);
  chatInput.value = '';
}

chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function applyVideoSetting() {
  const disabled = document.getElementById('mainDisableVideo').checked;
  entry('Video ' + (disabled ? 'disabled' : 'enabled'), 'info');
  if (localStream) {
    localStream.getVideoTracks().forEach(t => t.enabled = !disabled);
  }
}

function doRefresh() {
  entry('Refreshing connection…', 'sys');
  onDrop();
}

function doFlip() {
  entry('Flip camera (not supported in audio-only mode)', 'info');
}

let peerLoaded = false;
function init(myId) {
  if (!peerLoaded) {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    document.head.appendChild(script);
    script.onload = () => { peerLoaded = true; startPeer(myId); };
  } else {
    startPeer(myId);
  }
}

function startPeer(myId) {
  if (peer) { try { peer.destroy(); } catch(e){} }
  peer = new Peer(myId, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]}
  });

  peer.on('open', () => {
    entry('Radio online — waiting for Alpha', 'ok');
    setStatus('standby');
  });

  peer.on('connection', dc => {
    dataConn = dc;
    dc.on('open', () => {
      entry('Chat channel open', 'ok');
      chatInput.disabled = false;
      sendBtn.disabled = false;
    });
    dc.on('data', msg => addBubble(msg, false));
    dc.on('close', () => {
      dataConn = null;
      chatInput.disabled = true;
      sendBtn.disabled = true;
      entry('Chat channel closed', 'sys');
    });
  });

  peer.on('call', incoming => {
    entry('Inbound call from Alpha', 'info');
    navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true
    }, video: false })
    .then(stream => {
      localStream = stream;
      muteLocal();
      if (window._disableVideo) {
        stream.getVideoTracks().forEach(t => t.enabled = false);
      }
      incoming.answer(stream);
      attachCall(incoming);
    })
    .catch(e => entry('Mic denied: ' + e.message, 'err'));
  });

  peer.on('error', e => {
    entry('Error: ' + e.message, 'err');
    if (e.type === 'unavailable-id') entry('ID in use — reload to retry', 'err');
  });
}

function attachCall(c) {
  call = c;
  c.on('stream', stream => {
    document.getElementById('remoteAudio').srcObject = stream;
    linked = true;
    setStatus('linked');
    entry('Linked to Alpha', 'ok');
    if (!window._disableAudio) ptt.className = 'ptt ready';
    else entry('PTT disabled (audio off)', 'info');
  });
  c.on('close', onDrop);
  c.on('error', e => { entry('Call error: ' + e.message, 'err'); onDrop(); });
}

function onDrop() {
  linked = false;
  call = null;
  dataConn = null;
  chatInput.disabled = true;
  sendBtn.disabled = true;
  ptt.className = 'ptt';
  setStatus('standby');
  entry('Link lost — waiting for Alpha', 'sys');
}

function muteLocal() {
  localStream?.getAudioTracks().forEach(t => t.enabled = false);
}

function startTx(e) {
  if (e) e.preventDefault();
  if (!linked || window._disableAudio) return;
  localStream?.getAudioTracks().forEach(t => t.enabled = true);
  ptt.className = 'ptt transmitting';
  entry('Transmitting…', 'tx');
}

function stopTx() {
  if (!linked) return;
  muteLocal();
  ptt.className = 'ptt ready';
  entry('End transmission', 'sys');
}
</script>
</body>
