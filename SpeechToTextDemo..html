
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --border: #e0ddd7;
      --text: #1a1916;
      --muted: #7a776f;
      --accent: #2a5f4f;
      --accent-light: #e8f2ee;
      --danger: #c0392b;
      --danger-light: #fdecea;
      --interim-color: #aaa8a0;
      --radius: 10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      display: block;
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    .dot.active {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(42, 95, 79, 0.2);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(42, 95, 79, 0.2); }
      50%       { box-shadow: 0 0 0 6px rgba(42, 95, 79, 0.08); }
    }

    .status-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .transcript-area {
      min-height: 180px;
      padding: 1.25rem 1.5rem;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text);
      word-break: break-word;
    }

    .transcript-area .interim {
      color: var(--interim-color);
    }

    .transcript-area.empty::before {
      content: 'Your transcript will appear here…';
      color: var(--interim-color);
      font-style: italic;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: var(--bg); border-color: #c5c2bc; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.38; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover:not(:disabled) { background: #214f40; border-color: #214f40; }

    .spacer { flex: 1; }

    .settings {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    .setting-item input[type="checkbox"] {
      width: 14px; height: 14px; cursor: pointer;
      accent-color: var(--accent);
    }

    select {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .error-box {
      display: none;
      margin: 0 16px 12px;
      padding: 10px 14px;
      background: var(--danger-light);
      border: 1px solid #f5c6c2;
      border-radius: 8px;
      font-size: 13px;
      color: var(--danger);
    }

    footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Speech to Text <span>Web Speech API · browser-native</span></h1>
  </header>

  <div class="card">
    <div class="status-bar">
      <div class="dot" id="dot"></div>
      <span class="status-label" id="status-label">Ready</span>
    </div>

    <div class="transcript-area empty" id="transcript-box">
      <span id="final-text"></span><span class="interim" id="interim-text"></span>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="controls">
      <button class="primary" id="btn-start" onclick="startListening()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Start listening
      </button>
      <button id="btn-stop" onclick="stopListening()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Stop
      </button>
      <button onclick="clearAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear
      </button>
      <div class="spacer"></div>
      <button id="btn-copy" onclick="copyText()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>

    <div class="settings">
      <label class="setting-item">
        <input type="checkbox" id="continuous-check"> Keep listening
      </label>
      <label class="setting-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <select id="lang-select">
          <option value="en-US">English (US)</option>
          <option value="en-GB" selected>English (UK)</option>
          <option value="es-ES">Spanish</option>
          <option value="fr-FR">French</option>
          <option value="de-DE">German</option>
          <option value="ja-JP">Japanese</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="pt-BR">Portuguese (BR)</option>
        </select>
      </label>
    </div>
  </div>

  <footer>Works in Chrome &amp; Edge · Requires microphone permission · No data leaves your browser</footer>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let finalText = '';

  function setStatus(state) {
    const dot = document.getElementById('dot');
    const label = document.getElementById('status-label');
    const startBtn = document.getElementById('btn-start');
    const stopBtn = document.getElementById('btn-stop');
    if (state === 'listening') {
      dot.classList.add('active');
      label.textContent = 'Listening…';
      startBtn.disabled = true;
      stopBtn.disabled = false;
    } else {
      dot.classList.remove('active');
      label.textContent = state === 'stopped' ? 'Stopped' : 'Ready';
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-box').style.display = 'none';
  }

  function updateBox() {
    const box = document.getElementById('transcript-box');
    const hasFinal = finalText.trim().length > 0;
    const hasInterim = document.getElementById('interim-text').textContent.trim().length > 0;
    box.classList.toggle('empty', !hasFinal && !hasInterim);
  }

  function startListening() {
    if (!SpeechRecognition) {
      showError('Your browser does not support the Web Speech API. Please use Chrome or Edge.');
      return;
    }
    clearError();
    if (recognition) recognition.abort();

    recognition = new SpeechRecognition();
    recognition.lang = document.getElementById('lang-select').value;
    recognition.continuous = document.getElementById('continuous-check').checked;
    recognition.interimResults = true;

    recognition.onstart = () => setStatus('listening');

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalText += e.results[i][0].transcript + ' ';
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      document.getElementById('final-text').textContent = finalText;
      document.getElementById('interim-text').textContent = interim;
      updateBox();
    };

    recognition.onerror = (e) => {
      const msgs = {
        'not-allowed': 'Microphone access denied. Allow mic access in your browser settings and try again.',
        'no-speech': 'No speech detected. Try speaking closer to your microphone.',
        'audio-capture': 'No microphone found. Check your audio input device.',
        'network': 'Network error. Check your connection.',
      };
      showError(msgs[e.error] || 'Error: ' + e.error);
      setStatus('ready');
    };

    recognition.onend = () => {
      document.getElementById('interim-text').textContent = '';
      updateBox();
      setStatus('stopped');
    };

    recognition.start();
  }

  function stopListening() {
    if (recognition) recognition.stop();
  }

  function clearAll() {
    finalText = '';
    document.getElementById('final-text').textContent = '';
    document.getElementById('interim-text').textContent = '';
    clearError();
    setStatus('ready');
    updateBox();
  }

  function copyText() {
    const text = finalText.trim();
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('btn-copy');
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied';
      setTimeout(() => btn.innerHTML = orig, 1500);
    });
  }
</script>

</body>
</html>
