
<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>ALPHA — Field Radio v6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg:         #6b7280;
    --panel:      #4b5563;
    --border:     #374151;
    --accent:     #00d4ff;
    --accent2:    #00ff9f;
    --warn:       #ffcc00;
    --danger:     #ff4444;
    --lcd-bg:     #0d1f12;
    --lcd-fg:     #39ff14;
    --btn-bg:     #374151;
    --btn-hover:  #4b5563;
    --btn-active: #1e3a5f;
    --text:       #f1f5f9;
    --text-dim:   #9ca3af;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .shell {
    display: flex;
    flex-direction: column;
    flex: 1;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    flex-shrink: 0;
  }
  .panel-label {
    position: absolute; top: -9px; left: 12px;
    background: var(--panel); padding: 0 6px;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; border-top: 2px solid var(--accent);
    padding: 10px 14px;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900;
    color: var(--accent); letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0,212,255,0.5); white-space: nowrap;
  }
  .logo .greek {
    font-family: 'Georgia', serif; font-size: 26px; font-weight: 700;
    vertical-align: middle; line-height: 1;
  }
  .logo span { color: var(--accent2); }

  .statusbar { display: flex; align-items: center; gap: 16px; flex: 1; flex-wrap: wrap; }
  .status-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .led {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    transition: background 0.2s, box-shadow 0.2s; flex-shrink: 0;
  }
  .led.on-green  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .led.on-cyan   { background: var(--accent);  box-shadow: 0 0 6px var(--accent);  }
  .led.on-yellow { background: var(--warn);    box-shadow: 0 0 6px var(--warn);    animation: blink 0.8s step-end infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .chat-panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #ccc #fff;
    background: #ffffff;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 2px;
  }

  .bubble {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
    border: 1px solid var(--border);
  }
  .bubble.mine {
    align-self: flex-end;
    background: rgba(0,212,255,0.15);
    border-color: var(--accent);
    color: #0a1520;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: rgba(0,255,159,0.12);
    border-color: var(--accent2);
    color: #0a1520;
  }
  .bubble .who {
    font-size: 9px; letter-spacing: 2px; margin-bottom: 4px;
    text-transform: uppercase; font-family: 'Orbitron', sans-serif;
  }
  .bubble.mine .who   { color: #0077aa; }
  .bubble.theirs .who { color: #007744; }

  .chat-input-row {
    display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: #0c1520; border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    outline: none; transition: border-color 0.2s;
  }
  .chat-input:focus   { border-color: var(--accent); }
  .chat-input:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-input::placeholder { color: var(--text-dim); }

  .btn {
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap; letter-spacing: 0.5px;
  }
  .btn:hover  { background: var(--btn-hover); border-color: #2a4060; }
  .btn:active { background: var(--btn-active); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── duplex status bar ── */
  .ptt-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex-shrink: 0;
  }
  .channel-row {
    display: flex; align-items: center; gap: 8px;
  }
  .duplex-bar {
    flex: 0 0 auto; height: 42px; padding: 0 16px;
    border-radius: 6px; border: 2px solid #1a2a1a;
    background: #050f05; color: #335533;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
    user-select: none; transition: all 0.3s; white-space: nowrap;
  }
  .duplex-bar.live {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,255,159,0.07);
    box-shadow: 0 0 20px rgba(0,255,159,0.2);
    text-shadow: 0 0 10px rgba(0,255,159,0.6);
    animation: fdx-pulse 2s ease-in-out infinite alternate;
  }
  @keyframes fdx-pulse { from{box-shadow:0 0 12px rgba(0,255,159,0.15)} to{box-shadow:0 0 28px rgba(0,255,159,0.35)} }
  .media-btn {
    flex: 0 0 auto; height: 36px; padding: 0 14px;
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.5px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .media-btn:hover { background: var(--btn-hover); }
  .media-btn.disabled-state {
    background: rgba(255,68,68,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }
  .media-btn.disabled-state:hover { background: rgba(255,68,68,0.25); }
  .media-btn.recording {
    background: rgba(255,68,68,0.2);
    border-color: #ff4444;
    color: #ff4444;
    animation: rec-blink 1.2s ease-in-out infinite;
  }
  @keyframes rec-blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .log-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex-shrink: 0;
  }
  .log {
    height: 76px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #ccc #fff;
    background: #ffffff;
    border-radius: 4px;
    padding: 4px 8px;
  }
  .log-entry {
    font-size: 10px; line-height: 1.9; letter-spacing: 0.5px;
    display: block;
  }
  .log-entry.sys  { color: #555555; }
  .log-entry.info { color: #0077aa; }
  .log-entry.ok   { color: #007744; }
  .log-entry.err  { color: #cc2222; }
  .log-entry.tx   { color: #996600; }

  .session-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .session-box {
    background: var(--panel); border: 1px solid var(--border);
    border-top: 2px solid var(--accent); border-radius: 8px; padding: 24px 28px; width: 280px;
  }
  .session-title {
    font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
    color: var(--accent); letter-spacing: 4px; margin-bottom: 16px; display: block;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
  }
  .session-box label {
    display: block; font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
  }
  .session-box input[type=text] {
    width: 100%; background: #0c1520; border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 4px;
    font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 4px;
    text-transform: uppercase; outline: none; margin-bottom: 14px;
  }
  .session-box input[type=text]:focus { border-color: var(--accent); }
  .session-go { width: 100%; padding: 10px; border-radius: 4px;
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'Orbitron', sans-serif;
    font-size: 12px; letter-spacing: 2px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .session-go:hover { background: var(--btn-hover); border-color: var(--accent); }

  /* login checkboxes */
  .session-checks {
    display: flex; gap: 14px; margin-bottom: 14px;
  }
  .session-check-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  .session-check-item input[type=checkbox] {
    width: 14px; height: 14px; accent-color: var(--accent);
    cursor: pointer; margin: 0;
  }

  /* 60-second login timeout bar */
  .login-timeout {
    margin-bottom: 14px;
  }
  .login-timeout-label {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--text-dim); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .login-timeout-label span { color: var(--warn); font-family: 'Orbitron', sans-serif; }
  .login-timeout-track {
    width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .login-timeout-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 1s linear, background 0.5s;
    width: 100%;
  }

  /* 10-minute session countdown in header */
  .session-timer {
    margin-left: auto;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--text-dim); letter-spacing: 2px;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .session-timer.warn { color: var(--warn); }
  .session-timer.danger { color: var(--danger); animation: blink 0.8s step-end infinite; }

  /* ── video ── */
  .video-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex: 1; min-height: 0;
  }
  .video-grid {
    display: grid; grid-template-columns: 1fr; gap: 8px; height: 100%;
  }
  .video-wrap {
    position: relative; background: #000; border-radius: 4px;
    overflow: hidden; aspect-ratio: 16/9;
  }
  .video-wrap video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .video-label {
    position: absolute; bottom: 6px; left: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 2px; color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .duplex-overlay {
    position: absolute; bottom: 6px; right: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 9px;
    font-weight: 700; letter-spacing: 2px;
    color: #335533; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    transition: color 0.3s;
  }
  .duplex-overlay.live {
    color: var(--accent2);
    text-shadow: 0 0 8px rgba(0,255,159,0.8);
    animation: fdx-pulse 2s ease-in-out infinite alternate;
  }
  .video-wrap.waiting::after {
    content: 'WAITING…';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 3px; color: var(--text-dim);
  }

  /* ── tab bar ── */
  .tab-bar {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; padding: 8px 14px;
    background: var(--border); border: 1px solid var(--border);
    border-radius: 6px 6px 0 0; border-bottom: none;
    color: var(--text-dim); font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 3px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    text-transform: uppercase; position: relative;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tab-btn:hover { background: var(--btn-hover); color: var(--text); }
  .tab-btn.active {
    background: var(--panel); border-color: var(--border);
    color: var(--accent); border-bottom: 1px solid var(--panel);
    margin-bottom: -1px; z-index: 1;
  }
  .tab-content {
    display: flex; flex-direction: column; flex: 1;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 0 8px 8px; overflow: hidden; min-height: 0;
    padding: 10px; gap: 10px;
  }
  .tab-pane { display: none; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
  .tab-pane.active { display: flex; }

  /* new-message badge */
  .msg-badge {
    display: none; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--warn); color: #1a1000;
    border-radius: 9px; font-size: 9px; font-weight: 900;
    font-family: 'Orbitron', sans-serif; letter-spacing: 0;
    animation: badge-pop 0.25s cubic-bezier(.36,.07,.19,.97);
  }
  .msg-badge.visible { display: flex; }
  @keyframes badge-pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }
</style>
</head>
<body>

<div class="session-overlay" id="sessionOverlay">
  <div class="session-box">
    <span class="session-title">α · 01</span>
    <label>Unit ID</label>
    <input type="text" id="sessionCode" maxlength="8" placeholder="ENTER CODE" autocomplete="off" />
    <div class="session-checks">
      <label class="session-check-item">
        <input type="checkbox" id="loginDisableVideo"> Disable Video
      </label>
      <label class="session-check-item">
        <input type="checkbox" id="loginDisableAudio"> Disable Audio
      </label>
    </div>
    <div class="login-timeout">
      <div class="login-timeout-label">
        <span>Login Timeout</span><span id="loginTimeoutSec">60s</span>
      </div>
      <div class="login-timeout-track"><div class="login-timeout-fill" id="loginTimeoutFill"></div></div>
    </div>
    <button class="session-go" onclick="startSession()">CONNECT</button>
  </div>
</div>

<div class="shell">

  <header>
    <div class="logo"><span class="greek">α</span><span>·</span>01</div>
    <div class="statusbar">
      <div class="status-item">
        <div class="led" id="linkLed"></div>
        <span id="statusText">OFFLINE</span>
      </div>
      <div class="status-item" id="unitIdDisplay" style="display:none;">
        <span style="color:var(--text-dim);font-size:10px;letter-spacing:1px;">UNIT ID</span>
        <span id="unitIdValue" style="color:var(--accent);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;"></span>
      </div>
    </div>
    <div class="session-timer" id="sessionTimerDisplay">⏱ --:--</div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn"        id="tabLocalBtn"  onclick="switchTab('local')">LOCAL</button>
    <button class="tab-btn active" id="tabRemoteBtn" onclick="switchTab('remote')">REMOTE</button>
    <button class="tab-btn"        id="tabChatBtn"   onclick="switchTab('chat')">CHAT <span class="msg-badge" id="msgBadge">0</span></button>
  </div>
  <div class="tab-content">
    <!-- LOCAL TAB -->
    <div class="tab-pane" id="paneLocal">
      <div class="channel-row" style="flex-shrink:0; padding:4px 0;">
        <button class="media-btn" id="videoBtn" onclick="toggleVideo()">Disable Video</button>
        <button class="media-btn" id="audioBtn" onclick="toggleAudio()">Disable Audio</button>
      </div>
      <div class="channel-row" style="flex-shrink:0; padding:0 0 4px 0;">
        <button class="media-btn" id="refreshBtnLocal" onclick="refreshScreen()">↺ Refresh</button>
        <button class="media-btn" id="flipBtn" onclick="flipCamera()">⟳ Flip</button>
        <button class="media-btn" id="recBtn" onclick="toggleRecord()">⏺ Record</button>
      </div>
      <div class="video-panel">
        <div class="panel-label">LOCAL — ALPHA</div>
        <div class="video-grid">
          <div class="video-wrap" id="localWrap">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="video-label">ALPHA</span>
            <span class="duplex-overlay" id="duplexBar">OFFLINE</span>
          </div>
        </div>
      </div>
    </div>
    <!-- REMOTE TAB -->
    <div class="tab-pane active" id="paneRemote">
      <div class="channel-row" style="flex-shrink:0; padding:4px 0;">
        <button class="media-btn" id="videoBtn2" onclick="toggleVideo()">Disable Video</button>
        <button class="media-btn" id="audioBtn2" onclick="toggleAudio()">Disable Audio</button>
      </div>
      <div class="channel-row" style="flex-shrink:0; padding:0 0 4px 0;">
        <button class="media-btn" id="refreshBtn" onclick="refreshScreen()">↺ Refresh</button>
        <button class="media-btn" id="flipBtn2" onclick="flipCamera()">⟳ Flip</button>
        <button class="media-btn" id="recBtn2" onclick="toggleRecord()">⏺ Record</button>
      </div>
      <div class="video-panel">
        <div class="panel-label">REMOTE — BRAVO</div>
        <div class="video-grid">
          <div class="video-wrap waiting" id="remoteWrap">
            <video id="remoteVideo" autoplay playsinline></video>
            <span class="video-label">BRAVO</span>
            <span class="duplex-overlay" id="duplexBar2">OFFLINE</span>
          </div>
        </div>
      </div>
    </div>
    <!-- CHAT TAB -->
    <div class="tab-pane" id="paneChat">
      <div class="chat-panel" style="flex:1">
        <div class="panel-label">COMMS</div>
        <div class="chat" id="chat"></div>
        <div class="chat-input-row">
          <input class="chat-input" id="chatInput" placeholder="TYPE MESSAGE…" />
          <button class="btn" id="sendBtn" onclick="sendChat()">SEND</button>
        </div>
      </div>
      <div class="log-panel">
        <div class="panel-label">SYS LOG</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const script = document.createElement('script');
script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
document.head.appendChild(script);
script.onload = () => {}; // init called after session code entered

// Free public TURN servers (Open Relay Project) — essential for mobile/carrier-NAT networks
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:openrelay.metered.ca:80' },
  { urls: 'turn:openrelay.metered.ca:80',       username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443',      username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
];

let MY_ID, REMOTE_ID;
let loginDisableVideoFlag = false;
let loginDisableAudioFlag = false;
let audioMuted = false;
let realAudioTrack = null;
let silentCtx = null;
let silentTrack = null;

let peer, call, dataConn, localStream, linked = false, retryTimer;

const linkLed   = document.getElementById('linkLed');
const statusEl  = document.getElementById('statusText');
const duplexBar = document.getElementById('duplexBar');
const logEl     = document.getElementById('log');
const chat      = document.getElementById('chat');
const chatInput = document.getElementById('chatInput');
const sendBtn   = document.getElementById('sendBtn');

function startSession() {
  const code = document.getElementById('sessionCode').value.trim().toUpperCase().replace(/\s+/g,'');
  if (!code) { document.getElementById('sessionCode').focus(); return; }
  MY_ID     = 'alpha-' + code;
  REMOTE_ID = 'bravo-' + code;
  // Persist code and checkbox states for next load
  const disVidChecked = document.getElementById('loginDisableVideo').checked;
  const disAudChecked = document.getElementById('loginDisableAudio').checked;
  try {
    localStorage.setItem('alpha_last_code', code);
    localStorage.setItem('alpha_disable_video', disVidChecked ? '1' : '0');
    localStorage.setItem('alpha_disable_audio', disAudChecked ? '1' : '0');
  } catch(e) {}
  loginDisableVideoFlag = disVidChecked;
  loginDisableAudioFlag = disAudChecked;
  // Always log the checkbox state so we can see it in the activity log
  entry('LOGIN: disableVideo=' + disVidChecked + ' disableAudio=' + disAudChecked, 'sys');
  clearInterval(loginTimeoutInterval);
  document.getElementById('sessionOverlay').style.display = 'none';
  document.getElementById('unitIdDisplay').style.display = 'flex';
  document.getElementById('unitIdValue').textContent = code;
  startSessionCountdown();

function linkify(text) {
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = m[1]; a.textContent = m[1];
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.cssText = 'color:inherit;text-decoration:underline;word-break:break-all;';
    frag.appendChild(a);
    last = re.lastIndex;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

function addBubble(text, mine) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + (mine ? 'mine' : 'theirs');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = mine ? 'ALPHA' : 'BRAVO';
  const msg = document.createElement('div');
  msg.appendChild(linkify(text));
  wrap.appendChild(who);
  wrap.appendChild(msg);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  // Badge: notify on video tab when a new incoming message arrives
  if (!mine && activeTab !== 'chat') {
    unreadCount++;
    msgBadge.textContent = unreadCount;
    msgBadge.classList.remove('visible');
    void msgBadge.offsetWidth; // reflow to restart animation
    msgBadge.classList.add('visible');
  }
}

function init() {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    entry('ERROR: HTTPS required for mic access', 'err');
    entry('Please open this page over HTTPS', 'err');
    return;
  }
  // Real WebRTC check — PeerJS error message can be misleading
  if (typeof RTCPeerConnection === 'undefined') {
    entry('ERROR: WebRTC not available in this browser', 'err');
    entry('Try Chrome or Firefox — make sure it is up to date', 'err');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    entry('ERROR: Mic API not available (try Chrome)', 'err');
    return;
  }
  // Acquire mic once up front — reused for all calls
  navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }, video: { facingMode: 'user' } })
  .then(stream => {
    localStream = stream;
    document.getElementById('localVideo').srcObject = stream;
    entry('Mic + camera ready', 'ok');
    // Apply login-screen disable flags
    if (loginDisableVideoFlag) {
      const vt = stream.getVideoTracks()[0];
      if (vt) { vt.enabled = false; }
      const vb = document.getElementById('videoBtn'); if(vb){vb.textContent='Enable Video';vb.classList.add('disabled-state');}
      const vb2 = document.getElementById('videoBtn2'); if(vb2){vb2.textContent='Enable Video';vb2.classList.add('disabled-state');}
      entry('Video disabled (login setting)', 'sys');
    }
    if (loginDisableAudioFlag) {
      const at = stream.getAudioTracks()[0];
      entry('AUDIO FLAG: track=' + (at ? at.label : 'none') + ' enabled=' + (at ? at.enabled : 'n/a'), 'sys');
      if (at) { realAudioTrack = at; at.enabled = false; audioMuted = true; }
      entry('AUDIO FLAG: audioMuted now=' + audioMuted, 'sys');
      const ab = document.getElementById('audioBtn'); if(ab){ab.textContent='Enable Audio';ab.classList.add('disabled-state');}
      const ab2 = document.getElementById('audioBtn2'); if(ab2){ab2.textContent='Enable Audio';ab2.classList.add('disabled-state');}
      entry('Audio disabled (login setting)', 'sys');
    } else {
      entry('AUDIO FLAG: not set, audio stays on', 'sys');
    }
    startPeer();
  })
  .catch(e => {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      entry('Mic blocked — click padlock in address bar, set Microphone to Allow, reload', 'err');
    } else if (e.name === 'NotFoundError') {
      entry('No microphone found on this device', 'err');
    } else if (e.name === 'SecurityError') {
      entry('Mic blocked by browser security policy', 'err');
    } else {
      entry('Mic error: ' + e.name + ' — ' + e.message, 'err');
    }
  });
}

function startPeer() {
  // Close any stale data connection from a previous peer instance
  if (dataConn) { try { dataConn.close(); } catch(e){} dataConn = null; }
  pendingDC = false;
  linked = false;

  peer = new Peer(MY_ID, {
    
    config: { iceServers: ICE_SERVERS }
  });

  peer.on('open', () => {
    entry('Radio online', 'ok');
    setStatus('calling');
    dial();
  });

  peer.on('connection', dc => {
    if (dataConn || pendingDC) { dc.close(); return; }
    entry('Inbound data channel from Bravo', 'sys');
    attachDataConn(dc);
  });

  peer.on('call', incoming => {
    entry('Inbound call from Bravo', 'info');
    answerCall(incoming);
  });

  peer.on('disconnected', () => {
    entry('Signalling server disconnected — reconnecting…', 'sys');
    if (!peer.destroyed) peer.reconnect();
  });

  peer.on('error', e => {
    entry('Peer error [' + e.type + ']: ' + e.message, 'err');
    if (e.type === 'browser-incompatible') return;
    if (e.type === 'peer-unavailable') {
      entry('Bravo offline — retry in 5s', 'sys');
      retryTimer = setTimeout(dial, 5000);
      return;
    }
    if (e.type === 'unavailable-id') {
      // Stale session holds the preferred ID — claim a random suffix variant immediately
      const suffix = Math.random().toString(36).slice(2,6).toUpperCase();
      MY_ID = MY_ID.replace(/-[A-Z0-9]{4}$/, '') + '-' + suffix || MY_ID + '-' + suffix;
      entry('ID taken (stale session) — retrying as ' + MY_ID + '…', 'sys');
      peer.destroy();
      setTimeout(startPeer, 1500);
      return;
    }
    // network / server-error / socket-error / socket-closed
    entry('Retrying in 6s…', 'sys');
    retryTimer = setTimeout(() => { peer.destroy(); startPeer(); }, 6000);
  });
}

function getCallStream() {
  const tracks = [...localStream.getVideoTracks()];
  entry('STREAM: audioMuted=' + audioMuted + ' audioTracks=' + localStream.getAudioTracks().length, 'sys');
  if (audioMuted) {
    tracks.push(getSilentTrack());
    entry('STREAM: using silent audio track', 'sys');
  } else {
    tracks.push(...localStream.getAudioTracks());
    entry('STREAM: using real audio track', 'sys');
  }
  return new MediaStream(tracks);
}

function dial() {
  clearTimeout(retryTimer);
  if (linked || !localStream) return;
  entry('Calling Bravo…', 'info');
  const c = peer.call(REMOTE_ID, getCallStream());
  attachCall(c);
  openDataConn();
}

function attachDataConn(dc) {
  dc.on('open', () => {
    pendingDC = false;
    dataConn = dc;
    entry('Chat channel open', 'ok');
  });
  dc.on('data', msg => addBubble(msg, false));
  dc.on('close', () => {
    pendingDC = false;
    dataConn = null;
    entry('Chat channel closed', 'sys');
  });
  dc.on('error', e => {
    pendingDC = false;
    entry('Data channel error: ' + (e.message || e), 'err');
  });
}

let pendingDC = false;
function openDataConn() {
  if (dataConn || pendingDC) return;
  pendingDC = true;
  entry('Opening data channel…', 'sys');
  const dc = peer.connect(REMOTE_ID, { reliable: true });
  attachDataConn(dc);
}

function answerCall(c) {
  clearTimeout(retryTimer);
  c.answer(getCallStream());
  attachCall(c);
}

function attachCall(c) {
  call = c;
  c.on('stream', stream => {
    document.getElementById('remoteAudio').srcObject = stream;
    const remoteVideo = document.getElementById('remoteVideo');
    remoteVideo.srcObject = stream;
    document.getElementById('remoteWrap').classList.remove('waiting');
    if (linked) return;
    linked = true;
    setStatus('linked');
    entry('Linked to Bravo — full duplex active', 'ok');
    duplexBar.textContent = '● LIVE';
    duplexBar.className = 'duplex-overlay live';
    syncControls();
  });
  c.on('close', onDrop);
  c.on('error', e => { entry('Call error: ' + e.message, 'err'); onDrop(); });
}

function onDrop() {
  linked = false;
  call = null;
  duplexBar.textContent = 'OFFLINE';
  duplexBar.className = 'duplex-overlay';
  syncControls();
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('remoteWrap').classList.add('waiting');
  setStatus('calling');
  entry('Link lost — retrying in 5s', 'sys');
  retryTimer = setTimeout(dial, 5000);
}

// ── Video+Mixed Audio Recording ───────────────────────────────
let mediaRecorder = null;
let recordChunks  = [];
let audioCtx      = null;
let mixDest       = null;
let recBusy       = false; // guard against double-trigger during onstop

function getMixer() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mixDest  = audioCtx.createMediaStreamDestination();
  }
  return mixDest;
}

function mixStream(stream) {
  const dest = getMixer();
  const src  = audioCtx.createMediaStreamSource(stream);
  src.connect(dest);
}

function toggleRecord() {
  const btn  = document.getElementById('recBtn');
  const btn2 = document.getElementById('recBtn2');
  if (recBusy) return;

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    recBusy = true;
    mediaRecorder.stop();
    btn.textContent  = '⏺ Record'; btn.classList.remove('recording');
    if (btn2) { btn2.textContent = '⏺ Record'; btn2.classList.remove('recording'); }
    entry('Recording stopped — saving…', 'sys');
    return;
  }

  // Guard: don't start if already set up but not yet 'recording'
  if (mediaRecorder && mediaRecorder.state !== 'inactive') return;

  if (!localStream) { entry('No local stream to record', 'err'); return; }

  // Always start a fresh mixer
  if (audioCtx) { audioCtx.close(); audioCtx = null; mixDest = null; }
  getMixer();
  mixStream(localStream);

  const remoteVideo = document.getElementById('remoteVideo');
  const hasRemote = remoteVideo.srcObject && remoteVideo.srcObject.getTracks().length > 0;
  if (hasRemote) mixStream(remoteVideo.srcObject);

  // Use remote video if available, otherwise fall back to local camera
  const videoTracks = hasRemote
    ? remoteVideo.srcObject.getVideoTracks()
    : localStream.getVideoTracks();

  const recStream = new MediaStream([
    ...videoTracks,
    ...mixDest.stream.getAudioTracks()
  ]);

  // Prefer MP4, fall back to WebM
  const mimeType = [
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ].find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';

  recordChunks  = [];
  mediaRecorder = new MediaRecorder(recStream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recBusy = false;
    audioCtx.close(); audioCtx = null; mixDest = null;
    if (recordChunks.length === 0) { entry('Recording empty — nothing saved', 'sys'); return; }
    const blob = new Blob(recordChunks, { type: mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const ts   = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.href = url; a.download = `alpha-recording-${ts}.${ext}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    entry(`Recording saved (${ext})`, 'ok');
  };
  mediaRecorder.start(1000);
  btn.textContent  = '⏹ Stop & Save'; btn.classList.add('recording');
  if (btn2) { btn2.textContent = '⏹ Stop & Save'; btn2.classList.add('recording'); }
  entry(`Recording started (${mimeType})…`, 'ok');
}

function toggleVideo() {
  if (!localStream) return;

// ── Silent audio track used when muted ───────────────────────
function getSilentTrack() {
  if (silentTrack && silentTrack.readyState !== 'ended') return silentTrack;
  silentCtx = new (window.AudioContext || window.webkitAudioContext)();
  const dest = silentCtx.createMediaStreamDestination();
  const osc  = silentCtx.createOscillator();
  const gain = silentCtx.createGain();
  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(dest);
  osc.start();
  silentTrack = dest.stream.getAudioTracks()[0];
  return silentTrack;
}

function toggleAudio() {
  if (!localStream) return;
  const btns = [document.getElementById('audioBtn'), document.getElementById('audioBtn2')];
  realAudioTrack = localStream.getAudioTracks()[0];

  if (!audioMuted) {
    audioMuted = true;
    if (realAudioTrack) realAudioTrack.enabled = false;
    // Best-effort replaceTrack on active call
    try {
      const pc = call && (call.peerConnection || call._pc);
      const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'audio');
      if (sender) sender.replaceTrack(getSilentTrack()).catch(() => {});
    } catch(e) {}
    btns.forEach(b => { if(b){ b.textContent = 'Enable Audio'; b.classList.add('disabled-state'); }});
    entry('Local audio muted', 'sys');
  } else {
    audioMuted = false;
    if (realAudioTrack) realAudioTrack.enabled = true;
    // Best-effort replaceTrack on active call
    try {
      const pc = call && (call.peerConnection || call._pc);
      const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'audio');
      if (sender && realAudioTrack) sender.replaceTrack(realAudioTrack).catch(() => {});
    } catch(e) {}
    btns.forEach(b => { if(b){ b.textContent = 'Disable Audio'; b.classList.remove('disabled-state'); }});
    entry('Local audio unmuted', 'sys');
  }
}

// ── Camera flip (Android front/back) ─────────────────────────
let currentFacingMode = 'user';
let flipping = false;

async function flipCamera() {
  if (!localStream || flipping) return;
  flipping = true;
  const flipBtn = document.getElementById('flipBtn');
  if (flipBtn) flipBtn.disabled = true;

  // Stop existing video track
  localStream.getVideoTracks().forEach(t => t.stop());

  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: currentFacingMode } },
      audio: false
    });
    const newVideoTrack = newStream.getVideoTracks()[0];

    // Replace track in localStream
    localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));
    localStream.addTrack(newVideoTrack);

    // Update local preview
    document.getElementById('localVideo').srcObject = localStream;

    // Replace track in active WebRTC call
    if (call && call.peerConnection) {
      const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) await sender.replaceTrack(newVideoTrack);
    }

    entry('Camera flipped to ' + (currentFacingMode === 'user' ? 'front' : 'rear'), 'ok');
  } catch (e) {
    // Exact facingMode failed — try without 'exact' as fallback
    try {
      const fallback = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode },
        audio: false
      });
      const newVideoTrack = fallback.getVideoTracks()[0];
      localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));
      localStream.addTrack(newVideoTrack);
      document.getElementById('localVideo').srcObject = localStream;
      if (call && call.peerConnection) {
        const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) await sender.replaceTrack(newVideoTrack);
      }
      entry('Camera flipped (fallback) to ' + (currentFacingMode === 'user' ? 'front' : 'rear'), 'ok');
    } catch (e2) {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; // revert
      entry('Camera flip failed: ' + e2.message, 'err');
    }
  } finally {
    flipping = false;
    if (flipBtn) flipBtn.disabled = false;
  }
}

window.addEventListener('beforeunload', () => { peer?.destroy(); });
</script>
</body>
