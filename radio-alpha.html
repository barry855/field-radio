<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .unit-name {
    font-size: 13px;
    letter-spacing: 6px;
    color: #666;
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .status-dot.standby { background: #f0a500; box-shadow: 0 0 6px #f0a500; }
  .status-dot.linked  { background: #22cc66; box-shadow: 0 0 6px #22cc66; }
  .status-dot.calling { background: #f0a500; box-shadow: 0 0 6px #f0a500; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #statusText {
    font-size: 11px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
  }
  #statusText.linked { color: #22cc66; }

  .log {
    width: 100%;
    max-width: 420px;
    height: 200px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 12px 14px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.8;
    color: #555;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .log .sys  { color: #444; }
  .log .info { color: #aaa; }
  .log .ok   { color: #22cc66; }
  .log .err  { color: #cc4444; }
  .log .tx   { color: #f0a500; }

  .ptt {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #333;
    background: #1a1a1a;
    color: #666;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: not-allowed;
    text-transform: uppercase;
    transition: all 0.08s;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ptt.ready {
    border-color: #444;
    color: #aaa;
    cursor: pointer;
  }
  .ptt.ready:hover {
    border-color: #666;
    background: #202020;
  }
  .ptt.active {
    border-color: #f0a500;
    background: #1f1600;
    color: #f0a500;
    box-shadow: 0 0 30px rgba(240,165,0,0.2);
    cursor: pointer;
  }
  .ptt.transmitting {
    border-color: #f0a500;
    background: #1f1600;
    color: #f0a500;
    box-shadow: 0 0 40px rgba(240,165,0,0.3);
    transform: scale(0.97);
  }
</style>
</head>
<body>

<header>
  <div class="status-dot" id="dot"></div>
  <div class="unit-name">Unit Alpha</div>
</header>

<div id="statusText">Offline</div>

<div class="log" id="log"></div>

<button class="ptt" id="ptt"
  onmousedown="startTx()"
  onmouseup="stopTx()"
  onmouseleave="stopTx()"
  ontouchstart="startTx(event)"
  ontouchend="stopTx()">PTT</button>

<audio id="remoteAudio" autoplay></audio>

<script>
const script = document.createElement('script');
script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
document.head.appendChild(script);
script.onload = init;

const MY_ID     = 'unit-alpha-2w';
const REMOTE_ID = 'unit-bravo-2w';

let peer, call, localStream, linked = false, retryTimer;

const dot    = document.getElementById('dot');
const status = document.getElementById('statusText');
const ptt    = document.getElementById('ptt');
const log    = document.getElementById('log');

function entry(msg, cls='sys') {
  const ts = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `${ts}  ${msg}`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function setStatus(state) {
  dot.className = 'status-dot ' + state;
  const labels = { '': 'Offline', standby: 'Standby', calling: 'Calling…', linked: 'Linked' };
  status.textContent = labels[state] || state;
  status.className = state === 'linked' ? 'linked' : '';
}

function init() {
  peer = new Peer(MY_ID, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]}
  });

  peer.on('open', () => {
    entry('Radio online', 'ok');
    setStatus('calling');
    dial();
  });

  // Handle inbound re-calls from Bravo (e.g. after a drop)
  peer.on('call', incoming => {
    entry('Inbound call from Bravo', 'info');
    answerCall(incoming);
  });

  peer.on('error', e => {
    entry('Error: ' + e.message, 'err');
    if (e.type === 'peer-unavailable') {
      entry('Bravo offline — retry in 5s', 'sys');
      retryTimer = setTimeout(dial, 5000);
    }
    if (e.type === 'unavailable-id') {
      entry('ID in use — reload to retry', 'err');
    }
  });
}

function dial() {
  clearTimeout(retryTimer);
  if (linked) return;
  entry('Calling Bravo…', 'info');
  navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }, video: false })
  .then(stream => {
    localStream = stream;
    muteLocal();
    const c = peer.call(REMOTE_ID, stream);
    attachCall(c);
  })
  .catch(e => entry('Mic denied: ' + e.message, 'err'));
}

function answerCall(c) {
  clearTimeout(retryTimer);
  navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }, video: false })
  .then(stream => {
    localStream = stream;
    muteLocal();
    c.answer(stream);
    attachCall(c);
  })
  .catch(e => entry('Mic denied: ' + e.message, 'err'));
}

function attachCall(c) {
  call = c;
  c.on('stream', stream => {
    document.getElementById('remoteAudio').srcObject = stream;
    linked = true;
    setStatus('linked');
    entry('Linked to Bravo', 'ok');
    ptt.className = 'ptt ready';
  });
  c.on('close', onDrop);
  c.on('error', e => { entry('Call error: ' + e.message, 'err'); onDrop(); });
}

function onDrop() {
  linked = false;
  call = null;
  ptt.className = 'ptt';
  setStatus('calling');
  entry('Link lost — retrying in 5s', 'sys');
  retryTimer = setTimeout(dial, 5000);
}

function muteLocal() {
  localStream?.getAudioTracks().forEach(t => t.enabled = false);
}

function startTx(e) {
  if (e) e.preventDefault();
  if (!linked) return;
  localStream?.getAudioTracks().forEach(t => t.enabled = true);
  ptt.className = 'ptt transmitting';
  entry('Transmitting…', 'tx');
}

function stopTx() {
  if (!linked) return;
  muteLocal();
  ptt.className = 'ptt ready';
  entry('End transmission', 'sys');
}
</script>
</body>
</html>
