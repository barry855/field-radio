
<!DOCTYPE html>
<!-- saved from url=(0052)file:///C:/Users/barry/Downloads/radio-bravo_21.html -->
<html lang="en" translate="no"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>BRAVO — Field Radio v6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg:         #6b7280;
    --panel:      #4b5563;
    --border:     #374151;
    --accent:     #00d4ff;
    --accent2:    #00ff9f;
    --warn:       #ffcc00;
    --danger:     #ff4444;
    --lcd-bg:     #0d1f12;
    --lcd-fg:     #39ff14;
    --btn-bg:     #374151;
    --btn-hover:  #4b5563;
    --btn-active: #1e3a5f;
    --text:       #f1f5f9;
    --text-dim:   #9ca3af;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .shell {
    display: flex;
    flex-direction: column;
    flex: 1;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    flex-shrink: 0;
  }
  .panel-label {
    position: absolute; top: -9px; left: 12px;
    background: var(--panel); padding: 0 6px;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; border-top: 2px solid var(--accent2);
    padding: 10px 14px;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900;
    color: var(--accent2); letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0,255,159,0.5); white-space: nowrap;
  }
  .logo .greek {
    font-family: 'Georgia', serif; font-size: 26px; font-weight: 700;
    vertical-align: middle; line-height: 1;
  }
  .logo span { color: var(--accent); }

  .statusbar { display: flex; align-items: center; gap: 16px; flex: 1; flex-wrap: wrap; }
  .status-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .led {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    transition: background 0.2s, box-shadow 0.2s; flex-shrink: 0;
  }
  .led.on-green  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .led.on-cyan   { background: var(--accent);  box-shadow: 0 0 6px var(--accent);  }
  .led.on-yellow { background: var(--warn);    box-shadow: 0 0 6px var(--warn); }

  .chat-panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #ccc #fff;
    background: #ffffff;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 2px;
  }

  .bubble {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
    border: 1px solid var(--border);
  }
  .bubble.mine {
    align-self: flex-end;
    background: rgba(0,255,159,0.15);
    border-color: var(--accent2);
    color: #0a1520;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: rgba(0,212,255,0.12);
    border-color: var(--accent);
    color: #0a1520;
  }
  .bubble .who {
    font-size: 9px; letter-spacing: 2px; margin-bottom: 4px;
    text-transform: uppercase; font-family: 'Orbitron', sans-serif;
  }
  .bubble.mine .who   { color: #007744; }
  .bubble.theirs .who { color: #0077aa; }

  .bubble .ts {
    font-size: 8px; color: #888; letter-spacing: 0.5px;
    margin-top: 4px; text-align: right;
  }

  /* connection quality */
  .quality-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  }
  .quality-bars {
    display: flex; align-items: flex-end; gap: 2px; height: 14px;
  }
  .quality-bars span {
    display: block; width: 4px; border-radius: 1px;
    background: #333; transition: background 0.4s;
  }
  .quality-bars span:nth-child(1) { height: 4px; }
  .quality-bars span:nth-child(2) { height: 8px; }
  .quality-bars span:nth-child(3) { height: 12px; }
  .quality-bars span.lit { background: var(--accent2); }
  .quality-bars span.lit-warn { background: var(--warn); }
  .quality-bars span.lit-bad  { background: var(--danger); }

  .chat-input-row {
    display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: #0c1520; border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    outline: none; transition: border-color 0.2s;
  }
  .chat-input:focus   { border-color: var(--accent2); }
  .chat-input:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-input::placeholder { color: var(--text-dim); }

  /* ── Drag-and-drop overlay ───────────────────────────────── */
  .chat-panel { position: relative; }
  .drop-overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,255,159,0.12);
    border: 2px dashed var(--accent2);
    border-radius: 8px;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .drop-overlay.active { display: flex; }
  .drop-overlay-icon { font-size: 32px; filter: drop-shadow(0 0 8px var(--accent2)); }
  .drop-overlay-label {
    font-family: 'Orbitron', sans-serif; font-size: 11px;
    letter-spacing: 3px; color: var(--accent2);
    text-transform: uppercase;
  }

  /* ── File attach button ─────────────────────────────────── */
  .attach-btn {
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text-dim); padding: 6px 10px; border-radius: 4px;
    font-size: 14px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    flex-shrink: 0; line-height: 1;
  }
  .attach-btn:hover { background: var(--btn-hover); border-color: var(--accent2); color: var(--accent2); }

  /* ── File preview strip ─────────────────────────────────── */
  .file-preview-strip {
    display: none; flex-wrap: wrap; gap: 6px;
    margin-top: 6px; flex-shrink: 0;
  }
  .file-preview-strip.has-files { display: flex; }
  .file-chip {
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,255,159,0.1); border: 1px solid var(--accent2);
    border-radius: 4px; padding: 3px 6px;
    font-size: 10px; color: var(--accent2); max-width: 180px;
    position: relative;
  }
  .file-chip-thumb {
    width: 28px; height: 28px; object-fit: cover;
    border-radius: 2px; flex-shrink: 0;
  }
  .file-chip-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; letter-spacing: 0.5px;
  }
  .file-chip-remove {
    cursor: pointer; font-size: 12px; color: var(--danger);
    flex-shrink: 0; padding: 0 2px;
    transition: color 0.15s;
  }
  .file-chip-remove:hover { color: #ff8888; }

  /* ── Media bubbles ──────────────────────────────────────── */
  .bubble img.media-img {
    max-width: 200px; max-height: 160px; border-radius: 4px;
    display: block; margin-top: 4px; cursor: zoom-in;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .bubble video.media-vid {
    max-width: 220px; max-height: 160px; border-radius: 4px;
    display: block; margin-top: 4px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .bubble .file-attach-link {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 4px; color: var(--accent2);
    font-size: 11px; text-decoration: none; letter-spacing: 0.5px;
  }
  .bubble .file-attach-link:hover { text-decoration: underline; }

  /* ── Lightbox ───────────────────────────────────────────── */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; box-shadow: 0 0 40px rgba(0,255,159,0.3); }

  .btn {
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap; letter-spacing: 0.5px;
  }
  .btn:hover  { background: var(--btn-hover); border-color: #2a4060; }
  .btn:active { background: var(--btn-active); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── duplex status bar ── */
  .ptt-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex-shrink: 0;
  }
  .channel-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .duplex-bar {
    flex: 0 0 auto; height: 42px; padding: 0 16px;
    border-radius: 6px; border: 2px solid #1a2a1a;
    background: #050f05; color: #335533;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
    user-select: none; transition: all 0.3s; white-space: nowrap;
  }
  .duplex-bar.live {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,255,159,0.07);
    box-shadow: 0 0 20px rgba(0,255,159,0.2);
    text-shadow: 0 0 10px rgba(0,255,159,0.6);
    animation: fdx-pulse 2s ease-in-out infinite alternate;
  }
  @keyframes fdx-pulse { from{box-shadow:0 0 12px rgba(0,255,159,0.15)} to{box-shadow:0 0 28px rgba(0,255,159,0.35)} }
  .media-btn {
    flex: 0 0 auto; height: 36px; padding: 0 10px;
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.5px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .media-btn:hover { background: var(--btn-hover); }
  .media-btn.screen-active {
    background: rgba(0,255,159,0.15);
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 0 8px rgba(0,255,159,0.3);
  }
  .media-btn.screen-active:hover { background: rgba(0,255,159,0.25); }
  .media-btn.disabled-state {
    background: rgba(255,68,68,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }
  .media-btn.disabled-state:hover { background: rgba(255,68,68,0.25); }
  .media-btn.video-on {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 8px rgba(0,212,255,0.22);
  }
  .media-btn.recording {
    background: rgba(255,68,68,0.2);
    border-color: #ff4444;
    color: #ff4444;
    animation: rec-blink 1.2s ease-in-out infinite;
  }
  @keyframes rec-blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .log-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex-shrink: 0;
  }
  .log {
    height: 76px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #ccc #fff;
    background: #ffffff;
    border-radius: 4px;
    padding: 4px 8px;
  }
  .log-entry {
    font-size: 10px; line-height: 1.9; letter-spacing: 0.5px;
    display: block;
  }
  .log-entry.sys  { color: #555555; }
  .log-entry.info { color: #0077aa; }
  .log-entry.ok   { color: #007744; }
  .log-entry.err  { color: #cc2222; }
  .log-entry.tx   { color: #996600; }

  .session-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .session-box {
    background: var(--panel); border: 1px solid var(--border);
    border-top: 2px solid var(--accent2); border-radius: 8px; padding: 24px 28px; width: 280px;
  }
  .session-title {
    font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
    color: var(--accent2); letter-spacing: 4px; margin-bottom: 16px; display: block;
    text-shadow: 0 0 20px rgba(0,255,159,0.5);
  }
  .session-box label {
    display: block; font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
  }
  .session-box input[type=text] {
    width: 100%; background: #0c1520; border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 4px;
    font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 4px;
    text-transform: uppercase; outline: none; margin-bottom: 14px;
  }
  .session-box input[type=text]:focus { border-color: var(--accent2); }
  .session-go {
    width: 100%; padding: 10px; border-radius: 4px;
    background: var(--btn-bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'Orbitron', sans-serif;
    font-size: 12px; letter-spacing: 2px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .session-go:hover { background: var(--btn-hover); border-color: var(--accent2); }

  /* login checkboxes */
  .session-checks {
    display: flex; gap: 14px; margin-bottom: 14px;
  }
  .session-check-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  .session-check-item input[type=checkbox] {
    width: 14px; height: 14px; accent-color: var(--accent2);
    cursor: pointer; margin: 0;
  }

  /* 60-second login timeout bar */
  .login-timeout {
    margin-bottom: 14px;
  }
  .login-timeout-label {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--text-dim); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .login-timeout-label span { color: var(--warn); font-family: 'Orbitron', sans-serif; }
  .login-timeout-track {
    width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .login-timeout-fill {
    height: 100%; background: var(--accent2); border-radius: 2px;
    transition: width 1s linear, background 0.5s;
    width: 100%;
  }

  /* 10-minute session countdown in header */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* ── video ── */
  .video-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; position: relative;
    flex: 0 1 auto; min-height: 0;
    max-height: min(42vh, 320px);
  }
  .video-grid {
    display: grid; grid-template-columns: 1fr; gap: 8px; height: auto;
  }
  .video-wrap {
    position: relative; background: #000; border-radius: 4px;
    overflow: hidden; aspect-ratio: 16/9;
    width: 100%; max-height: min(34vh, 280px);
  }
  .video-wrap video {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .video-label {
    position: absolute; bottom: 6px; left: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 2px; color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .duplex-overlay {
    position: absolute; bottom: 6px; right: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 9px;
    font-weight: 700; letter-spacing: 2px;
    color: #335533; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    transition: color 0.3s;
  }
  .duplex-overlay.live {
    color: var(--accent2);
    text-shadow: 0 0 8px rgba(0,255,159,0.8);
    animation: fdx-pulse 2s ease-in-out infinite alternate;
  }
  .video-wrap.waiting::after {
    content: 'WAITING…';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 3px; color: var(--text-dim);
  }
  .video-wrap.video-off::after {
    content: 'VIDEO OFF';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 3px; color: var(--warn);
    background: rgba(0,0,0,0.72);
  }
  .video-wrap.no-video::after {
    content: 'NO VIDEO';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 3px; color: var(--text-dim);
    background: rgba(0,0,0,0.72);
  }
  .mini-video-overlay {
    position: absolute; top: 16px; right: 20px; z-index: 4;
    width: clamp(112px, 30%, 170px); aspect-ratio: 16/9;
    background: #000; border: 1px solid var(--accent2);
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,0.42);
  }
  .mini-video-overlay.hidden { display: none; }
  .mini-video-overlay video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .mini-video-overlay .video-label {
    bottom: 4px; left: 6px; font-size: 8px; letter-spacing: 1px;
  }
  .mini-video-overlay.no-video::after {
    content: 'NO VIDEO';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 8px;
    letter-spacing: 2px; color: var(--text-dim);
    background: rgba(0,0,0,0.72);
  }

  /* ── tab bar ── */
  .tab-bar {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; padding: 8px 14px;
    background: var(--border); border: 1px solid var(--border);
    border-radius: 6px 6px 0 0; border-bottom: none;
    color: var(--text-dim); font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 3px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    text-transform: uppercase; position: relative;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tab-btn:hover { background: var(--btn-hover); color: var(--text); }
  .tab-btn.active {
    background: var(--panel); border-color: var(--border);
    color: var(--accent2); border-bottom: 1px solid var(--panel);
    margin-bottom: -1px; z-index: 1;
  }
  .tab-content {
    display: flex; flex-direction: column; flex: 1;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 0 8px 8px; overflow: visible; min-height: 0;
    padding: 10px; gap: 10px;
  }
  .tab-pane { display: none; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
  .tab-pane.active { display: flex; }
  .app-tooltip {
    position: fixed; z-index: 1000; pointer-events: none;
    max-width: min(240px, calc(100vw - 16px));
    padding: 6px 8px; border-radius: 4px;
    background: #050f15; border: 1px solid var(--accent2);
    color: var(--text); font-size: 10px; line-height: 1.35;
    letter-spacing: 0.7px; text-transform: uppercase;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    opacity: 0; transform: translateY(3px);
    transition: opacity 0.12s, transform 0.12s;
  }
  .app-tooltip.visible { opacity: 1; transform: translateY(0); }

  /* new-message badge */
  .msg-badge {
    display: none; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--warn); color: #1a1000;
    border-radius: 9px; font-size: 9px; font-weight: 900;
    font-family: 'Orbitron', sans-serif; letter-spacing: 0;
    animation: badge-pop 0.25s cubic-bezier(.36,.07,.19,.97);
  }
  .msg-badge.visible { display: flex; }
  @keyframes badge-pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }

  /* ── Speaker / earphone toggle ─────────────────────────────── */
  .speaker-btn {
    flex: 0 0 auto; height: 36px; padding: 0 10px;

function linkify(text) {
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = m[1]; a.textContent = m[1];
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.cssText = 'color:inherit;text-decoration:underline;word-break:break-all;';
    frag.appendChild(a);
    last = re.lastIndex;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

// ── Chat history (localStorage) ──────────────────────────────
const HISTORY_KEY = () => 'bravo_chat_' + (MY_ID || 'unknown');
const HISTORY_MAX = 200;

function saveMessage(text, mine) {
  try {
    const key = HISTORY_KEY();
    const history = JSON.parse(localStorage.getItem(key) || '[]');
    history.push({ text, mine, ts: Date.now() });
    if (history.length > HISTORY_MAX) history.splice(0, history.length - HISTORY_MAX);
    localStorage.setItem(key, JSON.stringify(history));
  } catch(e) {}
}

function loadHistory() {
  try {
    const key = HISTORY_KEY();
    const history = JSON.parse(localStorage.getItem(key) || '[]');
    if (history.length === 0) return;
    const divider = document.createElement('div');
    divider.style.cssText = 'text-align:center;font-size:9px;color:#888;letter-spacing:2px;padding:4px 0;';
    divider.textContent = '— PREVIOUS SESSION —';
    chat.appendChild(divider);
    history.forEach(m => addBubble(m.text, m.mine, m.ts, false));
    const divider2 = document.createElement('div');
    divider2.style.cssText = 'text-align:center;font-size:9px;color:#888;letter-spacing:2px;padding:4px 0;';
    divider2.textContent = '— NOW —';
    chat.appendChild(divider2);
    chat.scrollTop = chat.scrollHeight;
  } catch(e) {}

function clearHistory() {

function formatTs(ts) {
  const d = new Date(ts);
  return d.toTimeString().slice(0,5);

function addBubble(text, mine, ts, save = true) {
  if (save) saveMessage(text, mine);
  const now = ts || Date.now();
  const wrap = document.createElement('div');

  const time = document.createElement('div');
  time.className = 'ts';
  time.textContent = formatTs(now);
  wrap.appendChild(who);
  wrap.appendChild(msg);
  wrap.appendChild(time);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  // Badge: notify on video tab when a new incoming message arrives
  if (!mine && activeTab !== 'chat') {
    unreadCount++;
    msgBadge.textContent = unreadCount;
    msgBadge.classList.remove('visible');
    void msgBadge.offsetWidth; // reflow to restart animation
    msgBadge.classList.add('visible');
  }
}

    screenBtn: 'Share screen or return to camera',
    screenBtn2: 'Share screen or return to camera',
    miniBtn: 'Show or hide the small video overlay',

    recBtn: 'Start or stop recording',
    recBtn2: 'Start or stop recording',
    attachBtn: 'Attach file / photo / video',
    speakerBtnLocal: 'Toggle speaker / earphone output',
    speakerBtnRemote: 'Toggle speaker / earphone output',
    zoomSliderLocal: 'Zoom local camera'
  };
  Object.entries(labels).forEach(([id, label]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.dataset.tooltip = label;
    el.setAttribute('aria-label', label);
    el.removeAttribute('title');
  });

  const tip = document.createElement('div');
  tip.className = 'app-tooltip';
  document.body.appendChild(tip);

  const place = target => {
    const rect = target.getBoundingClientRect();
    tip.textContent = target.dataset.tooltip;
    tip.classList.add('visible');
    const tr = tip.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - tr.width / 2;
    let top = rect.top - tr.height - 8;
    if (top < 8) top = rect.bottom + 8;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };
  const hide = () => tip.classList.remove('visible');

  document.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', () => place(el));
    el.addEventListener('focus', () => place(el));
    el.addEventListener('mouseleave', hide);
    el.addEventListener('blur', hide);
    el.addEventListener('click', hide);
  });
}

  dropOverlay.classList.remove('active');
  const items = [...e.dataTransfer.items];
  const files = items.filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) addFiles(files);
});

// ── Also allow paste of images ────────────────────────────────
document.addEventListener('paste', e => {
  if (activeTab !== 'chat') return;
  const items = [...(e.clipboardData?.items || [])];
  const imageItems = items.filter(i => i.type.startsWith('image/'));
  if (imageItems.length) {
    e.preventDefault();
    addFiles(imageItems.map(i => i.getAsFile()).filter(Boolean));
  }
});

// ── Add files to pending queue ────────────────────────────────
function addFiles(files) {
  files.forEach(f => {
    if (f.size > 10 * 1024 * 1024) {
      entry('File too large (max 10 MB): ' + f.name, 'err'); return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const item = { file: f, dataUrl: ev.target.result };
      pendingFiles.push(item);
      renderFileChip(item, pendingFiles.length - 1);
    };
    reader.readAsDataURL(f);
  });
}

function renderFileChip(item, idx) {
  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.dataset.idx = idx;
  if (item.file.type.startsWith('image/')) {
    const thumb = document.createElement('img');
    thumb.className = 'file-chip-thumb';
    thumb.src = item.dataUrl;
    chip.appendChild(thumb);
  } else {
    const icon = document.createElement('span');
    icon.textContent = fileIcon(item.file.type);
    icon.style.fontSize = '18px';
    chip.appendChild(icon);
  }
  const name = document.createElement('span');
  name.className = 'file-chip-name';
  name.textContent = item.file.name;
  chip.appendChild(name);
  const rm = document.createElement('span');
  rm.className = 'file-chip-remove';
  rm.textContent = '✕';
  rm.addEventListener('click', () => removeFile(idx, chip));
  chip.appendChild(rm);
  filePreviewStrip.appendChild(chip);
  filePreviewStrip.classList.add('has-files');
}

function removeFile(idx, chip) {
  pendingFiles.splice(idx, 1);
  chip.remove();
  if (pendingFiles.length === 0) filePreviewStrip.classList.remove('has-files');
  [...filePreviewStrip.querySelectorAll('.file-chip')].forEach((c, i) => { c.dataset.idx = i; });
}

function fileIcon(type) {
  if (type.startsWith('video/')) return '🎬';
  if (type.startsWith('audio/')) return '🎵';
  if (type === 'application/pdf') return '📄';
  return '📎';
}

// ── Send pending files over data channel ──────────────────────
function sendPendingFiles() {
  [...pendingFiles].forEach(item => {
    const payload = JSON.stringify({ __file: true, name: item.file.name, type: item.file.type, data: item.dataUrl });
    try {
      dataConn.send(payload);
      addMediaBubble(item.file.name, item.file.type, item.dataUrl, true);
    } catch(e) {
      entry('Failed to send file: ' + item.file.name, 'err');
    }
  });
  pendingFiles.length = 0;
  filePreviewStrip.innerHTML = '';
  filePreviewStrip.classList.remove('has-files');
}

// ── Render a media bubble (sent or received) ──────────────────
function addMediaBubble(name, type, dataUrl, mine) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + (mine ? 'mine' : 'theirs');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = mine ? 'BRAVO' : 'ALPHA';
  wrap.appendChild(who);
  if (type.startsWith('image/')) {
    const img = document.createElement('img');
    img.className = 'media-img';
    img.src = dataUrl;
    img.addEventListener('click', () => { lightboxImg.src = dataUrl; lightbox.classList.add('open'); });
    wrap.appendChild(img);
  } else if (type.startsWith('video/')) {
    const vid = document.createElement('video');
    vid.className = 'media-vid';
    vid.src = dataUrl;
    vid.controls = true;
    vid.playsInline = true;
    wrap.appendChild(vid);
  } else {
    const a = document.createElement('a');
    a.className = 'file-attach-link';
    a.href = dataUrl;
    a.download = name;
    a.textContent = fileIcon(type) + ' ' + name;
    wrap.appendChild(a);
  }
  const time = document.createElement('div');
  time.className = 'ts';
  time.textContent = formatTs(Date.now());
  wrap.appendChild(time);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

lightbox.addEventListener('click', () => { lightbox.classList.remove('open'); lightboxImg.src = ''; });

function init() {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    entry('ERROR: HTTPS required for mic access', 'err');
    entry('Please open this page over HTTPS', 'err');
    return;
  }
  // Real WebRTC check — PeerJS error message can be misleading
  if (typeof RTCPeerConnection === 'undefined') {
    entry('ERROR: WebRTC not available in this browser', 'err');
    entry('Try Chrome or Firefox — make sure it is up to date', 'err');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    entry('ERROR: Mic API not available (try Chrome)', 'err');
    return;
  }
  // Acquire mic + camera — facingMode only used as a soft hint on mobile,
  // omitted on desktop to avoid OverconstrainedError on macOS.
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const videoConstraint = isMobile ? { facingMode: 'user' } : true;

  function applyStreamFlags(stream) {
    localStream = stream;
    document.getElementById('localVideo').srcObject = stream;
    entry('Mic + camera ready', 'ok');
    syncMiniVideos();
    updateLocalVideoState();
    if (loginDisableVideoFlag) {
      const vt = stream.getVideoTracks()[0];
      if (vt) { vt.enabled = false; }
      updateLocalVideoState();
      entry('Video disabled (login setting)', 'sys');
    }
    if (loginDisableAudioFlag) {
      const at = stream.getAudioTracks()[0];
      entry('AUDIO FLAG: track=' + (at ? at.label : 'none') + ' enabled=' + (at ? at.enabled : 'n/a'), 'sys');
      if (at) { realAudioTrack = at; at.enabled = false; audioMuted = true; }
      entry('AUDIO FLAG: audioMuted now=' + audioMuted, 'sys');
      const ab = document.getElementById('audioBtn'); if(ab){ab.textContent='Enable Audio';ab.classList.add('disabled-state');}
      const ab2 = document.getElementById('audioBtn2'); if(ab2){ab2.textContent='Enable Audio';ab2.classList.add('disabled-state');}
      entry('Audio disabled (login setting)', 'sys');
    } else {
      entry('AUDIO FLAG: not set, audio stays on', 'sys');
    }
    startPeer();
  }

  function handleMediaError(e) {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      entry('Mic blocked — click padlock in address bar, set Microphone to Allow, reload', 'err');
    } else if (e.name === 'NotFoundError') {
      entry('No microphone found on this device', 'err');
    } else if (e.name === 'SecurityError') {
      entry('Mic blocked by browser security policy', 'err');
    } else {
      entry('Mic error: ' + e.name + ' — ' + e.message, 'err');
    }
  }

  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: videoConstraint
  })
  .then(applyStreamFlags)
  .catch(e => {
    // Camera failed (OverconstrainedError, NotFoundError, NotReadableError etc.) — retry audio-only
    if (e.name !== 'NotAllowedError' && e.name !== 'PermissionDeniedError' && e.name !== 'SecurityError') {
      entry('Camera unavailable (' + e.name + ') — retrying audio-only', 'sys');
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      })
      .then(applyStreamFlags)
      .catch(handleMediaError);
    } else {
      handleMediaError(e);
    }
  });
}

function startPeer() {
  // Close any stale data connection from a previous peer instance
  if (dataConn) { try { dataConn.close(); } catch(e){} dataConn = null; }
  linked = false;
  pendingDC = false;

  peer = new Peer(MY_ID, {
    
    config: { iceServers: ICE_SERVERS }
  });

  let watchdog;
  peer.on('open', id => {
    entry('Radio online — waiting for Alpha [' + id + ']', 'ok');
    setStatus('standby');
    // Watchdog: if no call arrives in 30s, reconnect to signalling server to stay fresh
    watchdog = setTimeout(() => {
      if (!linked && !peer.destroyed) {
        entry('Refreshing signalling connection…', 'sys');
        if (peer.disconnected) peer.reconnect();
      }
    }, 30000);
  });

  peer.on('connection', dc => {
    if (dataConn || pendingDC) { dc.close(); return; }
    entry('Inbound data channel from Alpha', 'sys');
    attachDataConn(dc);
  });

  peer.on('call', incoming => {
    entry('Inbound call from Alpha', 'info');
    if (!localStream) {
      entry('ERROR: no local stream — cannot answer', 'err');
      incoming.close();
      return;
    }
    attachCall(incoming);
    incoming.answer(getCallStream());
  });

  peer.on('disconnected', () => {
    entry('Signalling server disconnected — reconnecting…', 'sys');
    saveRecordingIfActive();
    if (!peer.destroyed) peer.reconnect();
  });

  peer.on('error', e => {
    entry('Peer error [' + e.type + ']: ' + e.message, 'err');
    if (e.type === 'browser-incompatible') return;
    if (e.type === 'unavailable-id') {
      const suffix = Math.random().toString(36).slice(2,6).toUpperCase();
      MY_ID = MY_ID.replace(/-[A-Z0-9]{4}$/, '') + '-' + suffix || MY_ID + '-' + suffix;
      entry('ID taken (stale session) — retrying as ' + MY_ID + '…', 'sys');
      peer.destroy();
      setTimeout(startPeer, 1500);
      return;
    }
    if (e.type === 'peer-unavailable') {
      // Alpha not registered yet — ignore, we're waiting for Alpha to call us
      entry('Alpha not yet visible — standing by…', 'sys');
      return;
    }
    // network / server-error / socket-error / socket-closed
    entry('Retrying in 6s…', 'sys');
    setTimeout(() => { peer.destroy(); startPeer(); }, 6000);
  });
}

function attachDataConn(dc) {
  dc.on('open', () => {
    dataConn = dc;
    entry('Chat channel open', 'ok');
    sendVideoState();
  });
  dc.on('data', msg => {
    if (typeof msg === 'string' && msg.startsWith('{')) {
      try {
        const f = JSON.parse(msg);
        if (f.__control === 'video') {
          updateRemoteVideoState(f.enabled, f.hasTrack !== false);
          return;
        }
        if (f.__file === true) {
          addMediaBubble(f.name, f.type, f.data, false);
          return;
        }
      } catch(e) {}
      addBubble(msg, false);
    } else {
      addBubble(msg, false);
    }
  });
  dc.on('close', () => {
    dataConn = null;
    entry('Chat channel closed', 'sys');
  });
  dc.on('error', e => {
    entry('Data channel error: ' + (e.message || e), 'err');
  });
}

let pendingDC = false;
function openDataConn() {
  if (dataConn || pendingDC) return;
  pendingDC = true;
  entry('Opening data channel to Alpha…', 'sys');
  const dc = peer.connect(REMOTE_ID, { reliable: true });
  dc.on('open',  () => { pendingDC = false; });
  dc.on('close', () => { pendingDC = false; });
  dc.on('error', () => { pendingDC = false; });
  attachDataConn(dc);
}

function getCallStream() {
  const tracks = [...localStream.getVideoTracks()];
  entry('STREAM: audioMuted=' + audioMuted + ' audioTracks=' + localStream.getAudioTracks().length, 'sys');
  if (audioMuted) {
    tracks.push(getSilentTrack());
    entry('STREAM: using silent audio track', 'sys');
  } else {
    tracks.push(...localStream.getAudioTracks());
    entry('STREAM: using real audio track', 'sys');
  }
  return new MediaStream(tracks);
}

// ── Connection quality polling ────────────────────────────────
let qualityInterval = null;

function startQualityPolling() {
  stopQualityPolling();
  qualityInterval = setInterval(async () => {
    if (!call) return;
    const pc = call.peerConnection || call._pc;
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      let rtt = null, lost = 0, sent = 0;
      stats.forEach(r => {
        if (r.type === 'remote-inbound-rtp' && r.kind === 'audio') {
          if (r.roundTripTime != null) rtt = r.roundTripTime * 1000;
          if (r.packetsLost != null) lost = r.packetsLost;
        }
        if (r.type === 'outbound-rtp' && r.kind === 'audio') {
          if (r.packetsSent != null) sent = r.packetsSent;
        }
      });
      const lossPct = sent > 0 ? (lost / sent) * 100 : 0;
      updateQuality(rtt, lossPct);
    } catch(e) {}
  }, 3000);
}

function stopQualityPolling() {
  if (qualityInterval) { clearInterval(qualityInterval); qualityInterval = null; }
  updateQuality(null, null);
}

function updateQuality(rtt, lossPct) {
  const bars  = [document.getElementById('qbar1'), document.getElementById('qbar2'), document.getElementById('qbar3')];
  const label = document.getElementById('qualityLabel');
  if (rtt === null) {
    bars.forEach(b => { b.className = ''; });
    label.textContent = '--';
    label.style.color = 'var(--text-dim)';
    return;
  }
  let score = 3;
  if (rtt > 300 || lossPct > 5)  score = 2;
  if (rtt > 600 || lossPct > 15) score = 1;
  const cls   = score === 3 ? 'lit' : score === 2 ? 'lit-warn' : 'lit-bad';
  const color = score === 3 ? 'var(--accent2)' : score === 2 ? 'var(--warn)' : 'var(--danger)';
  bars.forEach((b, i) => { b.className = i < score ? cls : ''; });
  label.textContent = Math.round(rtt) + 'ms';
  label.style.color = color;
}

function setVideoButtons(enabled) {
  const btns = [document.getElementById('videoBtn'), document.getElementById('videoBtn2')];
  btns.forEach(b => {
    if (!b) return;
    b.textContent = enabled ? 'Video On' : 'Video Off';
    b.classList.toggle('video-on', enabled);
    b.classList.toggle('disabled-state', !enabled);
  });
}

function updateLocalVideoState() {
  const wrap = document.getElementById('localWrap');
  const track = localStream && localStream.getVideoTracks()[0];
  if (!wrap) return;
  wrap.classList.toggle('no-video', !track);
  wrap.classList.toggle('video-off', !!track && !track.enabled);
  if (track) setVideoButtons(track.enabled);
}

function updateRemoteVideoState(enabled, hasTrack = true) {
  const wrap = document.getElementById('remoteWrap');
  if (!wrap) return;
  wrap.classList.toggle('no-video', !hasTrack);
  wrap.classList.toggle('video-off', hasTrack && enabled === false);
}

function sendVideoState() {
  if (!dataConn || !localStream) return;
  const track = localStream.getVideoTracks()[0];
  try {
    dataConn.send(JSON.stringify({
      __control: 'video',
      enabled: !!(track && track.enabled),
      hasTrack: !!track
    }));
  } catch(e) {}
}

function attachCall(c) {
  call = c;
  c.on('stream', stream => {
    document.getElementById('remoteAudio').srcObject = stream;
    const remoteVideo = document.getElementById('remoteVideo');
    remoteVideo.srcObject = stream;
    syncMiniVideos();
    document.getElementById('remoteWrap').classList.remove('waiting');
    updateRemoteVideoState(true, stream.getVideoTracks().length > 0);
    stream.getVideoTracks().forEach(track => {
      track.addEventListener('mute', () => updateRemoteVideoState(false, true));
      track.addEventListener('unmute', () => updateRemoteVideoState(true, true));
      track.addEventListener('ended', () => updateRemoteVideoState(false, false));
    });
    if (linked) return;
    linked = true;
    setStatus('linked');
    entry('Linked to Alpha — full duplex active', 'ok');
    duplexBar.textContent = '● LIVE';
    duplexBar.className = 'duplex-overlay live';
    syncControls();
    startQualityPolling();
    // Ensure data channel is open
    openDataConn();
    // Apply mute state now that senders are live
    if (audioMuted) {
      entry('DEBUG applying mute on stream event', 'sys');
      applyMuteToSenders();
    }
  });
  c.on('close', onDrop);
  c.on('error', e => { entry('Call error: ' + e.message, 'err'); onDrop(); });
}

// ── Save recording if a disconnection interrupts it ──────────
function saveRecordingIfActive() {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  entry('Connection lost — auto-saving recording…', 'sys');
  const btn  = document.getElementById('recBtn');
  const btn2 = document.getElementById('recBtn2');
  if (btn)  { btn.textContent  = '⏺ Record'; btn.classList.remove('recording'); }
  if (btn2) { btn2.textContent = '⏺ Record'; btn2.classList.remove('recording'); }
  recBusy = true;
  mediaRecorder.stop(); // triggers onstop → saves file automatically
}

function onDrop() {
  saveRecordingIfActive();
  linked = false;
  call = null;
  // Reset data channel state so it re-opens cleanly on reconnect
  if (dataConn) { try { dataConn.close(); } catch(e){} dataConn = null; }
  pendingDC = false;
  stopQualityPolling();
  duplexBar.textContent = 'OFFLINE';
  duplexBar.className = 'duplex-overlay';
  syncControls();
  const _ra = document.getElementById('remoteAudio');
  if (_ra) { try { _ra.pause(); _ra.srcObject = null; } catch(e){} }
  document.getElementById('remoteVideo').srcObject = null;
  syncMiniVideos();
  document.getElementById('remoteWrap').classList.remove('video-off', 'no-video');
  document.getElementById('remoteWrap').classList.add('waiting');
  setStatus('standby');
  entry('Link lost — waiting for Alpha', 'sys');
}

function muteLocal() {
  // no-op — full duplex, mic always open when linked
}

// ── Session timeout (10 min inactivity) ──────────────────────
let lockTimer;
let autoReconnectTimer;
function resetLockTimer() {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => {
    document.getElementById('sessionOverlay').style.display = 'flex';
    document.getElementById('unitIdDisplay').style.display = 'none';
    prefillLogin();
    saveRecordingIfActive();
    if (peer) { peer.destroy(); }
    entry('Session timed out — auto-reconnecting…', 'sys');
    // Auto-reconnect after 3 seconds (only on timeout, not on manual Refresh)
    let autoSecs = 3;
    const btn = document.querySelector('.session-go');
    const origText = btn.textContent;
    btn.textContent = `AUTO-CONNECT (${autoSecs}s) — TAP TO CANCEL`;
    btn.style.borderColor = 'var(--warn)';
    btn.style.color = 'var(--warn)';
    const cancelOnce = () => {
      clearTimeout(autoReconnectTimer);
      clearInterval(autoCountdown);
      btn.textContent = origText;
      btn.style.borderColor = '';
      btn.style.color = '';
      startLoginTimeout();
      btn.removeEventListener('click', cancelOnce);
    };
    btn.addEventListener('click', cancelOnce, { once: true });
    const autoCountdown = setInterval(() => {
      autoSecs--;
      if (autoSecs > 0) {
        btn.textContent = `AUTO-CONNECT (${autoSecs}s) — TAP TO CANCEL`;
      } else {
        clearInterval(autoCountdown);
        btn.removeEventListener('click', cancelOnce);
        btn.textContent = origText;
        btn.style.borderColor = '';
        btn.style.color = '';
        startSession();
      }
    }, 1000);
  }, 10 * 60 * 1000);
}
['click','keydown','mousemove','touchstart'].forEach(ev =>
  document.addEventListener(ev, resetLockTimer, { passive: true })
);
resetLockTimer();

// ── Video+Mixed Audio Recording ───────────────────────────────
let mediaRecorder = null;
let recordChunks  = [];
let audioCtx      = null;
let mixDest       = null;
let recBusy       = false;

function getMixer() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mixDest  = audioCtx.createMediaStreamDestination();
  }
  return mixDest;
}

function mixStream(stream) {
  const dest = getMixer();
  const src  = audioCtx.createMediaStreamSource(stream);
  src.connect(dest);
}

function toggleRecord() {
  const btn  = document.getElementById('recBtn');
  const btn2 = document.getElementById('recBtn2');
  if (recBusy) return;

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    recBusy = true;
    mediaRecorder.stop();
    btn.textContent  = '⏺ Record'; btn.classList.remove('recording');
    if (btn2) { btn2.textContent = '⏺ Record'; btn2.classList.remove('recording'); }
    entry('Recording stopped — saving…', 'sys');
    return;
  }

  if (mediaRecorder && mediaRecorder.state !== 'inactive') return;

  if (!localStream) { entry('No local stream to record', 'err'); return; }

  if (audioCtx) { audioCtx.close(); audioCtx = null; mixDest = null; }
  getMixer();
  mixStream(localStream);

  const remoteVideo = document.getElementById('remoteVideo');
  const hasRemote = remoteVideo.srcObject && remoteVideo.srcObject.getTracks().length > 0;
  if (hasRemote) mixStream(remoteVideo.srcObject);

  // Use remote video if available, otherwise fall back to local camera
  const videoTracks = hasRemote
    ? remoteVideo.srcObject.getVideoTracks()
    : localStream.getVideoTracks();

  const recStream = new MediaStream([
    ...videoTracks,
    ...mixDest.stream.getAudioTracks()
  ]);

  const mimeType = [
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ].find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';

  recordChunks  = [];
  mediaRecorder = new MediaRecorder(recStream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recBusy = false;
    audioCtx.close(); audioCtx = null; mixDest = null;
    if (recordChunks.length === 0) { entry('Recording empty — nothing saved', 'sys'); return; }
    const blob = new Blob(recordChunks, { type: mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const ts   = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.href = url; a.download = `bravo-recording-${ts}.${ext}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    entry(`Recording saved (${ext})`, 'ok');
  };
  mediaRecorder.start(1000);
  btn.textContent  = '⏹ Stop & Save'; btn.classList.add('recording');
  if (btn2) { btn2.textContent = '⏹ Stop & Save'; btn2.classList.add('recording'); }
  entry(`Recording started (${mimeType})…`, 'ok');
}

function toggleVideo() {
  if (!localStream) return;
  const track = localStream.getVideoTracks()[0];
  if (!track) return;
  if (track.enabled) {
    track.enabled = false;
    setVideoButtons(false);
    entry('Local video disabled', 'sys');
  } else {
    track.enabled = true;
    setVideoButtons(true);
    entry('Local video enabled', 'sys');
  }
  updateLocalVideoState();
  sendVideoState();
}

// ── Screen Share ──────────────────────────────────────────────
let screenSharing = false;
let cameraTrack = null;
let screenTrack = null;

async function toggleScreenShare() {
  const btns = [document.getElementById('screenBtn'), document.getElementById('screenBtn2')];
  if (!screenSharing) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      entry('Screen share not supported in this browser', 'err'); return;
    }
    try {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      screenTrack = screenStream.getVideoTracks()[0];

      cameraTrack = localStream.getVideoTracks()[0] || null;
      if (cameraTrack) localStream.removeTrack(cameraTrack);
      localStream.addTrack(screenTrack);

      document.getElementById('localVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = localStream;
      syncMiniVideos();
      updateLocalVideoState();
      sendVideoState();

      try {
        const pc = call && (call.peerConnection || call._pc);
        const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) await sender.replaceTrack(screenTrack);
      } catch(e) { entry('Screen share track replace error: ' + e.message, 'err'); }

      screenSharing = true;
      btns.forEach(b => { if(b){ b.textContent = 'CAMERA'; b.classList.add('screen-active'); }});
      entry('Screen share started', 'ok');

      screenTrack.addEventListener('ended', () => {
        if (screenSharing) stopScreenShare();
      });
    } catch(e) {
      if (e.name !== 'NotAllowedError') entry('Screen share error: ' + e.message, 'err');
    }
  } else {
    stopScreenShare();
  }
}

async function stopScreenShare() {
  if (!screenSharing) return;
  const btns = [document.getElementById('screenBtn'), document.getElementById('screenBtn2')];
  screenSharing = false;

  if (screenTrack) { screenTrack.stop(); screenTrack = null; }
  localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));

  let restoreTrack = cameraTrack && cameraTrack.readyState !== 'ended' ? cameraTrack : null;
  if (!restoreTrack) {
    try {
      const cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
      restoreTrack = cam.getVideoTracks()[0];
    } catch(e) { entry('Could not restore camera: ' + e.message, 'err'); }
  }

  if (restoreTrack) {
    localStream.addTrack(restoreTrack);
    cameraTrack = restoreTrack;
  }

  document.getElementById('localVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = localStream;
  syncMiniVideos();
  updateLocalVideoState();
  sendVideoState();

  try {
    const pc = call && (call.peerConnection || call._pc);
    const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender && restoreTrack) await sender.replaceTrack(restoreTrack);
  } catch(e) {}

  btns.forEach(b => { if(b){ b.textContent = 'Share'; b.classList.remove('screen-active'); }});
  entry('Screen share stopped — camera restored', 'ok');
}

// ── Silent audio track used when muted ───────────────────────
function getSilentTrack() {
  if (silentTrack && silentTrack.readyState !== 'ended') return silentTrack;
  silentCtx = new (window.AudioContext || window.webkitAudioContext)();
  const dest = silentCtx.createMediaStreamDestination();
  const osc  = silentCtx.createOscillator();
  const gain = silentCtx.createGain();
  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(dest);
  osc.start();
  silentTrack = dest.stream.getAudioTracks()[0];
  return silentTrack;
}

function toggleAudio() {
  if (!localStream) return;
  const btns = [document.getElementById('audioBtn'), document.getElementById('audioBtn2')];
  realAudioTrack = localStream.getAudioTracks()[0];

  if (!audioMuted) {
    audioMuted = true;
    if (realAudioTrack) realAudioTrack.enabled = false;
    try {
      const pc = call && (call.peerConnection || call._pc);
      const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'audio');
      if (sender) sender.replaceTrack(getSilentTrack()).catch(() => {});
    } catch(e) {}
    btns.forEach(b => { if(b){ b.textContent = 'Enable Audio'; b.classList.add('disabled-state'); }});
    entry('Local audio muted', 'sys');
  } else {
    audioMuted = false;
    if (realAudioTrack) realAudioTrack.enabled = true;
    try {
      const pc = call && (call.peerConnection || call._pc);
      const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'audio');
      if (sender && realAudioTrack) sender.replaceTrack(realAudioTrack).catch(() => {});
    } catch(e) {}
    btns.forEach(b => { if(b){ b.textContent = 'Disable Audio'; b.classList.remove('disabled-state'); }});
    entry('Local audio unmuted', 'sys');
  }
}

// ── Refresh Screen — reloads page (Unit ID pre-fills from localStorage) ──
function refreshScreen() {
  window.location.reload();
}

// ── Camera flip (Android front/back) ─────────────────────────
let currentFacingMode = 'user';
let flipping = false;

async function flipCamera() {
  if (!localStream || flipping) return;
  flipping = true;
  const flipBtn = document.getElementById('flipBtn');
  if (flipBtn) flipBtn.disabled = true;

  const targetMode = currentFacingMode === 'user' ? 'environment' : 'user';

  // Keep a reference to the old track — don't stop it yet
  const oldVideoTrack = localStream.getVideoTracks()[0] || null;

  async function tryAcquire() {
    // Try with exact facingMode first
    try {
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: targetMode } }, audio: false
      });
    } catch(e) {}
    // Brief pause so Android camera hardware fully releases
    await new Promise(r => setTimeout(r, 400));
    // Try without exact
    try {
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: targetMode }, audio: false
      });
    } catch(e) {}
    // Last resort — any camera
    await new Promise(r => setTimeout(r, 400));
    return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }

  try {
    const newStream = await tryAcquire();
    const newTrack  = newStream.getVideoTracks()[0];

    // Now safe to stop and replace the old track
    if (oldVideoTrack) {
      oldVideoTrack.stop();
      localStream.removeTrack(oldVideoTrack);
    }
    localStream.addTrack(newTrack);
    currentFacingMode = targetMode;

    document.getElementById('localVideo').srcObject = localStream;
    syncMiniVideos();

    // Replace track in active WebRTC call
    const pc = call && (call.peerConnection || call._pc);
    if (pc) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) await sender.replaceTrack(newTrack).catch(() => {});
    }

    entry('Camera flipped to ' + (currentFacingMode === 'user' ? 'front' : 'rear'), 'ok');
  } catch(e) {
    // All attempts failed — leave localStream with the original track untouched
    entry('Camera flip failed: ' + e.message, 'err');
  } finally {
    flipping = false;
    if (flipBtn) flipBtn.disabled = false;
  }
}


// ── Speaker / Earphone toggle ─────────────────────────────────
let speakerMode = true;

async function toggleSpeaker() {
  speakerMode = !speakerMode;
  const btns = [
    document.getElementById('speakerBtnLocal'),
    document.getElementById('speakerBtnRemote')
  ];
  const ra = document.getElementById('remoteAudio');
  if (speakerMode) {
    if (ra && ra.setSinkId) {
      try { await ra.setSinkId(''); } catch(e) { entry('setSinkId: ' + e.message, 'sys'); }
    }
    btns.forEach(b => { if(b){ b.textContent='🔊 Speaker'; b.classList.add('speaker-on'); b.classList.remove('speaker-ear'); }});
    entry('Audio: loudspeaker', 'sys');
  } else {
    if (ra && ra.setSinkId) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const earphone = devices.find(d => d.kind === 'audiooutput' &&
          /earpiece|receiver|phone/i.test(d.label));
        if (earphone) await ra.setSinkId(earphone.deviceId);
      } catch(e) { entry('setSinkId earphone: ' + e.message, 'sys'); }
    }
    btns.forEach(b => { if(b){ b.textContent='🎧 Earphone'; b.classList.remove('speaker-on'); b.classList.add('speaker-ear'); }});
    entry('Audio: earphone', 'sys');
  }
}

// ── Local video zoom ──────────────────────────────────────────
function applyZoom(val, channel) {
  const v = parseFloat(val);
  if (channel === 'local') {
    const vid = document.getElementById('localVideo');
    if (vid) vid.style.transform = v > 1 ? `scale(${v})` : '';
    const lbl = document.getElementById('zoomValLocal');
    if (lbl) lbl.textContent = v.toFixed(1) + '×';
    const s2 = document.getElementById('zoomSliderRemote');
    if (s2 && s2.value !== String(val)) { s2.value = val; applyZoom(val, 'remote-sync'); }
  } else if (channel === 'remote-sync') {
    const lbl2 = document.getElementById('zoomValRemote');
    if (lbl2) lbl2.textContent = parseFloat(val).toFixed(1) + '×';
  }
}
