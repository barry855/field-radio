<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #ffffff;
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #2e2e2e;
    flex-shrink: 0;
  }
  .unit { font-size: 14px; font-weight: 700; letter-spacing: 4px; color: #fff; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #888;
    text-transform: uppercase;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.calling { background: #f0a500; box-shadow: 0 0 8px #f0a500; animation: pulse 1s infinite; }
  .dot.linked  { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .bubble.mine {
    align-self: flex-end;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    color: #fff;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: #222;
    border: 1px solid #333;
    color: #ddd;
  }
  .bubble .who {
    font-size: 9px;
    letter-spacing: 2px;
    color: #666;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .bubble.mine .who { color: #f0a500; }
  .bubble.theirs .who { color: #4caf50; }

  /* ── Chat input ── */
  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid #2e2e2e;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    border-radius: 4px;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input::placeholder { color: #555; }
  .chat-input:focus { border-color: #555; }
  .chat-input:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 16px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s, border-color 0.15s;
  }
  .send-btn:hover { background: #333; border-color: #555; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── PTT ── */
  .ptt-row {
    padding: 16px 20px;
    border-top: 1px solid #2e2e2e;
    flex-shrink: 0;
  }
  .ptt {
    width: 100%;
    height: 72px;
    border-radius: 6px;
    border: 2px solid #333;
    background: #222;
    color: #555;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: not-allowed;
    transition: all 0.08s;
    user-select: none;
    -webkit-user-select: none;
  }
  .ptt.ready {
    border-color: #444;
    color: #aaa;
    cursor: pointer;
  }
  .ptt.ready:hover { background: #282828; border-color: #555; }
  .ptt.transmitting {
    background: #1f1600;
    border-color: #f0a500;
    color: #f0a500;
    box-shadow: 0 0 20px rgba(240,165,0,0.15);
    transform: scale(0.99);
  }

  /* ── Log ── */
  .log {
    height: 100px;
    border-top: 1px solid #2e2e2e;
    padding: 10px 20px;
    overflow-y: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .log-entry {
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }
  .log-entry.sys  { color: #444; }
  .log-entry.info { color: #777; }
  .log-entry.ok   { color: #4caf50; }
  .log-entry.err  { color: #e05555; }
  .log-entry.tx   { color: #f0a500; }
</style>
</head>
<body>

<header>
  <div class="unit">ALPHA</div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Offline</span>
  </div>
</header>

<div class="chat" id="chat"></div>

<div class="chat-input-row">
  <input class="chat-input" id="chatInput" placeholder="Type a message…" disabled />
  <button class="send-btn" id="sendBtn" onclick="sendChat()" disabled>Send</button>
</div>

<div class="ptt-row">
  <button class="ptt" id="ptt"
    onmousedown="startTx()"
    onmouseup="stopTx()"
    onmouseleave="stopTx()"
    ontouchstart="startTx(event)"
    ontouchend="stopTx()">Hold to Talk</button>
</div>

<div class="log" id="log"></div>

<audio id="remoteAudio" autoplay></audio>

<script>
const script = document.createElement('script');
script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
document.head.appendChild(script);
script.onload = init;

const MY_ID     = 'unit-alpha-2w';
const REMOTE_ID = 'unit-bravo-2w';

let peer, call, dataConn, localStream, linked = false, retryTimer, dataRetryTimer;

const dot       = document.getElementById('dot');
const statusEl  = document.getElementById('statusText');
const ptt       = document.getElementById('ptt');
const logEl     = document.getElementById('log');
const chat      = document.getElementById('chat');
const chatInput = document.getElementById('chatInput');
const sendBtn   = document.getElementById('sendBtn');

/* ── Logging ── */
function entry(msg, cls='sys') {
  const ts = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.className = 'log-entry ' + cls;
  d.textContent = `${ts}  ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ── Status ── */
function setStatus(state) {
  dot.className = 'dot ' + state;
  const labels = { '': 'Offline', calling: 'Calling…', linked: 'Linked' };
  statusEl.textContent = labels[state] ?? state;
}

/* ── Chat bubbles ── */
function addBubble(text, mine) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + (mine ? 'mine' : 'theirs');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = mine ? 'Alpha' : 'Bravo';
  const msg = document.createElement('div');
  msg.textContent = text;
  wrap.appendChild(who);
  wrap.appendChild(msg);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

/* ── Send chat ── */
function sendChat() {
  const txt = chatInput.value.trim();
  if (!txt || !dataConn) return;
  dataConn.send(txt);
  addBubble(txt, true);
  chatInput.value = '';
}

chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

/* ── Data channel ── */
function openDataConn() {
  clearTimeout(dataRetryTimer);
  if (dataConn) return;
  const dc = peer.connect(REMOTE_ID, { reliable: true });
  dc.on('open', () => {
    dataConn = dc;
    entry('Chat channel open', 'ok');
    chatInput.disabled = false;
    sendBtn.disabled = false;
  });
  dc.on('data', msg => addBubble(msg, false));
  dc.on('close', () => {
    dataConn = null;
    chatInput.disabled = true;
    sendBtn.disabled = true;
    entry('Chat channel closed', 'sys');
    if (linked) dataRetryTimer = setTimeout(openDataConn, 3000);
  });
  dc.on('error', () => {
    dataConn = null;
    if (linked) dataRetryTimer = setTimeout(openDataConn, 3000);
  });
}

peer && peer.on('connection', dc => {
  dc.on('data', msg => addBubble(msg, false));
});

/* ── PeerJS init ── */
function init() {
  peer = new Peer(MY_ID, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]}
  });

  peer.on('open', () => {
    entry('Radio online', 'ok');
    setStatus('calling');
    dial();
  });

  peer.on('connection', dc => {
    dataConn = dc;
    dc.on('open', () => {
      entry('Chat channel open', 'ok');
      chatInput.disabled = false;
      sendBtn.disabled = false;
    });
    dc.on('data', msg => addBubble(msg, false));
    dc.on('close', () => {
      dataConn = null;
      chatInput.disabled = true;
      sendBtn.disabled = true;
      entry('Chat channel closed', 'sys');
    });
  });

  peer.on('call', incoming => {
    entry('Inbound call from Bravo', 'info');
    answerCall(incoming);
  });

  peer.on('error', e => {
    entry('Error: ' + e.message, 'err');
    if (e.type === 'peer-unavailable') {
      entry('Bravo offline — retry in 5s', 'sys');
      retryTimer = setTimeout(dial, 5000);
    }
    if (e.type === 'unavailable-id') entry('ID in use — reload to retry', 'err');
  });
}

function dial() {
  clearTimeout(retryTimer);
  if (linked) return;
  entry('Calling Bravo…', 'info');
  navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }, video: false })
  .then(stream => {
    localStream = stream;
    muteLocal();
    const c = peer.call(REMOTE_ID, stream);
    attachCall(c);
    openDataConn();
  })
  .catch(e => entry('Mic denied: ' + e.message, 'err'));
}

function answerCall(c) {
  clearTimeout(retryTimer);
  navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }, video: false })
  .then(stream => {
    localStream = stream;
    muteLocal();
    c.answer(stream);
    attachCall(c);
  })
  .catch(e => entry('Mic denied: ' + e.message, 'err'));
}

function attachCall(c) {
  call = c;
  c.on('stream', stream => {
    document.getElementById('remoteAudio').srcObject = stream;
    linked = true;
    setStatus('linked');
    entry('Linked to Bravo', 'ok');
    ptt.className = 'ptt ready';
  });
  c.on('close', onDrop);
  c.on('error', e => { entry('Call error: ' + e.message, 'err'); onDrop(); });
}

function onDrop() {
  linked = false;
  call = null;
  dataConn = null;
  chatInput.disabled = true;
  sendBtn.disabled = true;
  ptt.className = 'ptt';
  setStatus('calling');
  entry('Link lost — retrying in 5s', 'sys');
  retryTimer = setTimeout(dial, 5000);
}

function muteLocal() {
  localStream?.getAudioTracks().forEach(t => t.enabled = false);
}

function startTx(e) {
  if (e) e.preventDefault();
  if (!linked) return;
  localStream?.getAudioTracks().forEach(t => t.enabled = true);
  ptt.className = 'ptt transmitting';
  entry('Transmitting…', 'tx');
}

function stopTx() {
  if (!linked) return;
  muteLocal();
  ptt.className = 'ptt ready';
  entry('End transmission', 'sys');
}
</script>
</body>
</html>
