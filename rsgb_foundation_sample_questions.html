", "q": "VHF/UHF signals", "o": ["are unaffected by buildings", "become weaker as they pass through buildings.", "become stronger at higher frequencies", "are unaffected by atmospheric conditions."], "a": "B", "img": null}, {"ref": "5C2", "n": 17, "ch": "VHF and above", "sec": "Section 5 – Propagation", "q": "Snow, ice and rain have the most detrimental effect on which frequency range?", "o": ["LF", "HF", "VHF", "UHF"], "a": "D", "img": null}, {"ref": "5C3", "n": 17, "ch": "VHF and above", "sec": "Section 5 – Propagation", "q": "A VHF transmitting antenna should be located", "o": ["indoors, protected from the rain, wind and sun.", "outdoors, as high as practicable to avoid obstruction.", "close to the transmitter so you can easily adjust it to the correct length.", "at ground level to minimise interference."], "a": "B", "img": null}, {"ref": "6A1", "n": 18, "ch": "EMC concepts", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Electromagnetic compatibility (EMC) means:", "o": ["the antenna is properly matched to the transmitter.", "the avoidance of interference between electronic equipment.", "ensuring electronic equipment generates small electromagnetic fields.", "amicrophone will work correctly when connected to a transmitter."], "a": "B", "img": null}, {"ref": "6A2", "n": 18, "ch": "EMC concepts", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "A radio amateur’s transmission is LEAST likely to cause interference to", "o": ["other amateurs.", "other radio users.", "an electric drill.", "an electronic security alarm."], "a": "C", "img": null}, {"ref": "6A3", "n": 18, "ch": "EMC concepts", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "An amateur radio transmitter can cause electromagnetic interference to", "o": ["electric drills.", "vacuum cleaners.", "lawn mowers.", "electronic equipment"], "a": "D", "img": null}, {"ref": "6A4", "n": 18, "ch": "EMC concepts", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Which of the following will NOT cause interference with the operation of a radio receiver?", "o": ["A lawn mower.", "An electric drill.", "Central heating controls.", "A SWR meter."], "a": "D", "img": null}, {"ref": "6B1", "n": 19, "ch": "Sources of interference and their effects", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Which of the following will NOT lead to an increase in risk of causing electromagnetic interference?", "o": ["Changing from SSB to FM transmission.", "Increasing the transmit power.", "Changing from PSK to Morse code transmission.", "Increasing the microphone gain."], "a": "A", "img": null}, {"ref": "6C1", "n": 19, "ch": "Routes of entry", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Which of the following is least likely to provide a route of entry of interference into domestic TV equipment.", "o": ["Feeder from the antenna to the transmitter.", "Electronic components inside the TV.", "Audio speaker leads.", "RF earth rod."], "a": "D", "img": null}, {"ref": "6D1", "n": 19, "ch": "Filtering and remedial measures", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Immunity to interference from most sources can be increased by", "o": ["Fitting chokes and filters in mains or antenna leads.", "Using longer mains leads to the TV.", "Fitting a preamplifier to the TV antenna input.", "Fitting a higher rated fuse to the TV plug."], "a": "A", "img": null}, {"ref": "6D4", "n": 19, "ch": "Filtering and remedial measures", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "A dummy load is used", "o": ["to test if RF signals are being conducted out of a transmitter through its power cables.", "to test the power being sent to the headphones in a receiver", "to match an aerial to a feeder", "to test the setting of the microphone gain on the transmitter."], "a": "A", "img": null}, {"ref": "6E1", "n": 19, "ch": "Station design and antenna placement / general principles", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "EMC problems can be minimised by", "o": ["using end fed long wire antennas.", "locating antennas as close as possible to houses.", "siting antennas as high and as far away from houses as possible.", "using loft antennas."], "a": "C", "img": null}, {"ref": "6E2", "n": 19, "ch": "Station design and antenna placement / general principles", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "An RF earth terminal of a transmitter should be connected to", "o": ["the metal pipework in the central heating system.", "the earth pin of the mains plug.", "the mains earth at the fuse box .", "a long copper rod buried in damp ground."], "a": "D", "img": null}, {"ref": "6F1", "n": 19, "ch": "Station design and antenna placement / general principles", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "When fitting a transceiver in a vehicle, whose reasonability is it to ensure that the installation is in accordance with vehicles electrical and management systems?", "o": ["The vehicle owner.", "The police.", "The driver's insurance company.", "The transceiver manufacturer."], "a": "A", "img": null}, {"ref": "6F2", "n": 19, "ch": "Station design and antenna placement / mobile installations", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "After fitting a transceiver in a vehicle, testing of the installation", "o": ["should be done with the vehicle stationary and all vehicles electrical systems running.", "should be done with the vehicle moving on the road and with all vehicle electrical systems running.", "is not required.", "is only required if specified by the vehicles insurers."], "a": "A", "img": null}, {"ref": "6F3", "n": 19, "ch": "Station design and antenna placement / mobile installations", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Which of the following is most likely to cause problems to an amateur radio receiver in a vehicle?", "o": ["Ignition Systems.", "Headlights control.", "Brake Lights.", "Automatic gearbox."], "a": "A", "img": null}, {"ref": "6G1", "n": 20, "ch": "Social aspects and testing", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "Your neighbour comes to your door and complains that the interference he is getting on his TV is being caused by your radio transmissions. You should", "o": ["offer to carry out test transmissions with his co-operation to verify his allegation.", "explain that it cannot be your radio transmissions as your equipment is 'CE' approved", "advice him to contact Ofcom for advice", "request that he comes to you with proof of his allegation."], "a": "A", "img": null}, {"ref": "6G2", "n": 20, "ch": "Social aspects and testing", "sec": "Section 6 – Electro magnetic compatibility (EMC)", "q": "A good reason for keeping a log of all transmission is because", "o": ["It will make it easier to check allegations of interference.", "it is required by Ofcom.", "it is a requirement of the amateur radio licence.", "it will help support an application for planning permission for an antenna."], "a": "A", "img": null}, {"ref": "7A1", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "Before transmitting you should first listen on a frequency and then ask if the frequency is clear because", "o": ["the frequency may be in use but one of the stations may be in a location where you can't receive their signal.", "it is a requirement of the amateur radio licence.", "this lets other amateur radio operators know that you are about to commence a QSO.", "it is considered to be polite to commence all new QSO's in this way."], "a": "A", "img": null}, {"ref": "7A2", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "When calling \"CQ, this is M7ABC calling CQ on 20 meters\" you should", "o": ["repeat the sequence several times in quick succession over a period of 20 - 30 seconds, then listen for several seconds", "call the sequence once and then listen for several seconds in between each", "repeat the sequence several times in quick succession, moving the transmit frequency up a few kHz each time.", "repeat the sequence several times in quick succession, moving the transmit frequency down a few kHz each time"], "a": "A", "img": null}, {"ref": "7A3", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "Once you have contacted another station on a VHF FM calling channel you should", "o": ["remain on the frequency until another station wishes to use it.", "remain on the frequency as long as the contact takes.", "ask if the frequency is clear.", "change frequency to a suitable clear channel."], "a": "D", "img": null}, {"ref": "7A4", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "The correct phonetic spelling of ‘SIGNAL’ is", "o": ["SIERRA ITALY GOLF NOVEMBER APPLE LIMA", "SIERRA ITALY GOLF NORWAY ALPHA LIMA", "SIERRA INDIA GOLF NOVEMBER ALPHA LIMA", "SUGAR INDIA GOLF NOVEMBER ALPHA LIMA"], "a": "C", "img": null}, {"ref": "7A5", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "If a log is recorded for obtaining a QSL or contest confirmation it should contain at least", "o": ["date, time (UTC), mode, callsign of station worked.", "date, time (UTC), mode, radio model, antenna type", "date, time (Local Time), mode, callsign of station worked.", "date, time (Local Time), mode, radio model, antenna type"], "a": "A", "img": null}, {"ref": "7A6", "n": 21, "ch": "Good operating practices and procedures", "sec": "Section 7 – Operating practices and procedures", "q": "If hearing bad language or inappropriate behaviour on air you should", "o": ["ignore it without comment and do not refer to it on air.", "ignore it and warn ug is", "o": ["Green/Yellow to Earth, Brown to Live, Blue to Neutral", "Brown to Earth, Red to Live, Blue to Neutral", "Brown to Earth, Green/Yellow to Live, Blue to Neutral", "Green/Yellow to Earth, Brown to Neutral, Red to Live"], "a": "A", "img": null}, {"ref": "8A4", "n": 24, "ch": "Electricity", "sec": "Section 8 – Safety", "q": "In the event that a fuse blows you should", "o": ["find out the cause of the problem.", "replace the fuse with one of a higher rating.", "measure the voltage across the fuse.", "return the affected equipment to the place of purchase."], "a": "A", "img": null}, {"ref": "8A5", "n": 24, "ch": "Electricity", "sec": "Section 8 – Safety", "q": "A Residual Current Circuit Breaker with Overcurrent Protection (RCBO) will stop mains power in a circuit:", "o": ["Only when there is a current leakage to earth above its leakage threshold.", "Only when there is an excessive current in the circuit above the current threshold.", "When there is both earth leakage and excessive current above the device threshold.", "When there is either earth leakage or excessive current above the device threshold."], "a": "D", "img": null}, {"ref": "8A6", "n": 24, "ch": "Electricity", "sec": "Section 8 – Safety", "q": "When carrying out maintenance or repair work on electronic equipment you should", "o": ["follow the manufacturers guidelines for servicing the equipment.", "ensure that the correct fuse is fitted to the mains plug.", "ensure that part of you is in contact with the metal chassis.", "have someone else present with you in the room."], "a": "A", "img": null}, {"ref": "8A7", "n": 24, "ch": "Electricity", "sec": "Section 8 – Safety", "q": "The mains power switch to the radio shack should be", "o": ["difficult to reach.", "key operated to prevent use by non-licensed persons.", "switched oﬀ at all times.", "in a clearly marked position"], "a": "D", "img": null}, {"ref": "8A8", "n": 24, "ch": "Electricity", "sec": "Section 8 – Safety", "q": "One feature of Nicad (NiCad), Nickel Metal Hydride (NIMH) and Lithium batteries is that", "o": ["they all have different charging requirements and must only be used with the recommended charger.", "the terminal voltages are all the same allowing almost any charger to be safely used.", "they may be safely discarded in the household waste or a litter bin in the street.", "they must be kept fully charged at all times to ensure a long life."], "a": "A", "img": null}, {"ref": "8B1", "n": 25, "ch": "Using tools", "sec": "Section 8 – Safety", "q": "When using power tools it is", "o": ["advisable to wear eye protection.", "advisable to wear ear protection.", "essential to wear breathing protection.", "essential to wear gloves."], "a": "A", "img": null}, {"ref": "8B2", "n": 25, "ch": "Using tools", "sec": "Section 8 – Safety", "q": "What safety considerations should you bear in mind when using power tools rather than hand tools?", "o": ["Power tools can do more damage and don’t stop instantly.", "Power tools can produce a neater and more accurate job.", "It is a lot less effort when using power tools.", "The job can be completed much more quickly."], "a": "A", "img": null}, {"ref": "8B7", "n": 25, "ch": "Using tools", "sec": "Section 8 – Safety", "q": "Soldering work stations:", "o": ["Require an emergency cut oﬀ switch in case the soldering tip comes into contact with the skin.", "Should be well ventilated to avoid inhaling fumes.", "Must be on an anti-static surface.", "Must be earthed."], "a": "B", "img": null}, {"ref": "8C1", "n": 25, "ch": "Working at height", "sec": "Section 8 – Safety", "q": "Why should two people be present during antenna erection?", "o": ["Because working at heights is risky and someone my be needed to fetch help.", "Because there needs to be someone on the ground who can see what needs doing.", "Because it saves constantly going up and down the ladder to read the SWR meter.", "Because the person doing the work will often need a hand."], "a": "A", "img": null}, {"ref": "8C2", "n": 25, "ch": "Working at height", "sec": "Section 8 – Safety", "q": "Overreaching when on a ladder may cause", "o": ["concern to passers by", "the person to fall off the ladder", "a hard hat to give less protection", "a poorly constructed or loose fitting job"], "a": "B", "img": null}, {"ref": "8C3", "n": 25, "ch": "Working at height", "sec": "Section 8 – Safety", "q": "The main purpose of wearing a tool belt when up a ladder is to", "o": ["prevent the tools being damaged", "provide a strong belt to tie to the ladder for safety", "avoid having to repeatedly climb the ladder", "reduce the risk of dropping tools"], "a": "D", "img": null}, {"ref": "8D1", "n": 26, "ch": "Working with RF", "sec": "Section 8 – Safety", "q": "Which part of the body is MOST susceptible to the effect of exposure to electromagnetic radiation?", "o": ["The arms.", "The torso.", "The head.", "The eyes."], "a": "D", "img": null}, {"ref": "8D2", "n": 26, "ch": "Working with RF", "sec": "Section 8 – Safety", "q": "The ICNIRP is of interest to amateurs because it", "o": ["oversees the preparation of the International Radio Regulations", "produces guidance on the safe levels of RF exposure", "co-ordinates the launch of amateur and other satellites", "produces the International version of the Amateur Band Plans"], "a": "B", "img": null}, {"ref": "8D3", "n": 26, "ch": "Working with RF", "sec": "Section 8 – Safety", "q": "The main risk when looking down waveguides is that", "o": ["microwave radiation could overheat your eye", "waveguides have very sharp edges and can cut", "you could be accidentally stabbed in the eye", "dust and small particles could be blown into the eyes"], "a": "A", "img": null}, {"ref": "8D4", "n": 26, "ch": "Working with RF", "sec": "Section 8 – Safety", "q": "Antennas connected to transmitting equipment", "o": ["should be mounted where they cannot accidentally be touched when in use.", "should be placed where they can easily be manually adjusted.", "must be connected with the shortest possible feeder.", "always require an antenna matching unit."], "a": "A", "img": null}, {"ref": "8E1", "n": 26, "ch": "Lightning", "sec": "Section 8 – Safety", "q": "When installing antennas high above the ground or in areas of high elevation", "o": ["measures should be taken to protect against lightning.", "warning lights should be fitted at the top to warn aircraft.", "twin feeder should be used.", "the mast should be insulated from the ground."], "a": "A", "img": null}, {"ref": "8F1", "n": 26, "ch": "Working mobile and portable", "sec": "Section 8 – Safety", "q": "When working a portable field station, feeder cables must be", "o": ["as long as possible.", "located away from overhead power cables.", "run along the ground to the antenna mast.", "as short as possible"], "a": "B", "img": null}, {"ref": "8F2", "n": 26, "ch": "Working mobile and portable", "sec": "Section 8 – Safety", "q": "When operating a portable station", "o": ["care should be taken to avoid trailing wires.", "asuitable amperage fuse should be installed at the generator to avoid electrocution.", "the local council should be informed", "Residual Current Circuit Breakers are not required."], "a": "A", "img": null}, {"ref": "8F3", "n": 26, "ch": "Working mobile and portable", "sec": "Section 8 – Safety", "q": "Using excessive volume when wearing headphones can result in", "o": ["complaints from neighbours about the noise", "damage to your transmitter", "overloading your receiver", "damage to your hearing"], "a": "D", "img": null}, {"ref": "8F4", "n": 26, "ch": "Working mobile and portable", "sec": "Section 8 – Safety", "q": "What of the following features should you consider when demonstrating amateur radio to a group of scouts and guides at their church hall to maximise safety?", "o": ["The location of antenna feeders and power cables.", "The seating arrangements so everybody has a good view.", "Sufficient club members to watch the presentation.", "The use of desk microphones rather than hand held."], "a": "A", "img": null}, {"ref": "8F5", "n": 26, "ch": "Working mobile and portable", "sec": "Section 8 – Safety", "q": "Who at a radio club meeting is responsible for the general health and safety of the club members and any visitors?", "o": ["All club members present.", "Each is responsible for themselves.", "The club chairman.", "The club safety officer"], "a": "A", "img": null}];
let A={};const KEY="rsgb-foundation-answers";

const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
[...new Set(D.map(d=>d.sec))].forEach(s=>$("sec").add(new Option(s,s)));

function status(d){const v=(A[d.ref]||"").toUpperCase();return !v?["","Please type in an answer..."]:v===d.a?["ok","Correct answer."]:["bad","Incorrect answer."]}
function render(){
 const f=$("sec").value;
 $("tb").innerHTML=D.filter(d=>!f||d.sec===f).map(d=>{const[c,t]=status(d),v=A[d.ref]||"";
  return `<tr class="${c}" data-r="${d.ref}"><td class="ref">${d.ref}</td><td>${d.n}</td><td>${esc(d.ch)}<div class="mut">${esc(d.sec)}</div></td>
  <td class="q"><div class="stem">${esc(d.q)}</div>${d.o.map((o,i)=>`<div class="opt"><b>${"ABCD"[i]}.</b><span>${esc(o)}</span></div>`).join("")}</td>
  <td>${d.img?`<img src="${d.img}" alt="Diagram for ${d.ref}">`:""}</td>
  <td><input maxlength="1" value="${v}" aria-label="Answer for ${d.ref}"></td><td class="st">${t}</td>
  <td class="x"><b>${d.a}</b></td><td class="x">${v?String(v.toUpperCase()===d.a).toUpperCase():"FALSE"}</td></tr>`}).join("");
 tally()}
function tally(){let a=0,c=0;D.forEach(d=>{const s=status(d)[0];if(s){a++;if(s==="ok")c++}});
 $("an").textContent=a;$("co").textContent=c;$("in").textContent=a-c}
$("tb").addEventListener("input",e=>{const i=e.target,tr=i.closest("tr"),ref=tr.dataset.r;
 let v=i.value.toUpperCase().replace(/[^A-D]/g,"");i.value=v;
 if(v)A[ref]=v;else delete A[ref];save();
 const d=D.find(x=>x.ref===ref),[c,t]=status(d);tr.className=c;tr.querySelector(".st").textContent=t;
 tr.lastElementChild.textContent=v?String(v===d.a).toUpperCase():"FALSE";tally()});
$("sec").onchange=render;
